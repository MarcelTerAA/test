<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure basisbegrippen — Ter AA Helmond</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --groen:#1D9E75;
  --groen-dark:#0F6E56;
  --groen-diep:#085041;
  --groen-licht:#E1F5EE;
  --blauw-licht:#E6F1FB;
  --blauw-dark:#0C447C;
  --amber-licht:#FAEEDA;
  --amber-dark:#633806;
  --rood-licht:#FBEAEA;
  --rood-dark:#8A1F1F;
  --grijs-licht:#F1EFE8;
  --grijs-mid:#5F5E5A;
  --tekst:#1a1a1a;
  --tekst-mid:#555;
  --tekst-licht:#888;
  --rand:#e0e0e0;
  --rand-mid:#ccc;
  --bg:#f9f9f7;
  --wit:#fff;
  --radius:10px;
  --radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tekst);min-height:100vh;font-size:15px;line-height:1.6}

.container{max-width:700px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* header */
.site-header{background:var(--groen);color:#fff;padding:1.25rem 1.5rem;border-radius:var(--radius);margin-bottom:1.25rem}
.site-header h1{font-size:20px;font-weight:600;margin-bottom:2px}
.site-header p{font-size:13px;opacity:0.85}

/* stappen-voortgang (grote flow) */
.stappen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.stap{padding:9px 4px;border-radius:var(--radius-sm);border:1px solid var(--rand);background:var(--wit);text-align:center;font-size:11px;font-weight:600;color:var(--tekst-licht);line-height:1.4}
.stap .stap-nr{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--grijs-licht);color:var(--tekst-licht);font-size:10px;font-weight:700;margin-bottom:4px}
.stap.actief{border-color:var(--groen);background:var(--groen-licht);color:var(--groen-diep)}
.stap.actief .stap-nr{background:var(--groen);color:#fff}
.stap.klaar{color:var(--groen-diep)}
.stap.klaar .stap-nr{background:var(--groen);color:#fff}

/* sub-voortgangsbalk (bv. vraag x van y) */
.subvoortgang-wrap{background:var(--wit);border:1px solid var(--rand);border-radius:var(--radius);padding:0.85rem 1.1rem;margin-bottom:1rem}
.subvoortgang-bar-bg{background:var(--grijs-licht);border-radius:99px;height:8px;overflow:hidden;margin:8px 0 4px}
.subvoortgang-bar-fill{height:100%;background:var(--groen);border-radius:99px;transition:width 0.3s ease}
.subvoortgang-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--tekst-licht)}

/* kaarten algemeen */
.kaart{background:var(--wit);border:1px solid var(--rand);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem}

/* intro scherm */
.intro-kaart{text-align:center;padding:2.5rem 1.75rem}
.intro-icoon{font-size:44px;margin-bottom:0.75rem}
.intro-kaart h2{font-size:19px;margin-bottom:0.75rem;color:var(--tekst)}
.intro-kaart p{font-size:14px;color:var(--tekst-mid);margin-bottom:0.6rem;max-width:480px;margin-left:auto;margin-right:auto}
.intro-lijst{text-align:left;max-width:420px;margin:1.25rem auto 1.5rem;font-size:13px;color:var(--tekst-mid)}
.intro-lijst li{margin-bottom:6px;list-style:none;padding-left:22px;position:relative}
.intro-lijst li::before{content:"✓";position:absolute;left:0;color:var(--groen);font-weight:700}

/* domein-badge */
.domein-badge{display:inline-flex;align-items:center;gap:5px;background:var(--blauw-licht);color:var(--blauw-dark);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:1rem}

/* vraag */
.vraag-tekst{font-size:16px;font-weight:600;color:var(--tekst);margin-bottom:1.25rem;line-height:1.55}
.opties{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.optie{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--rand-mid);border-radius:var(--radius-sm);background:var(--wit);cursor:pointer;font-size:14px;font-family:inherit;color:var(--tekst);transition:all 0.14s}
.optie:hover{border-color:var(--groen);background:var(--groen-licht)}
.optie.geselecteerd{border-color:var(--groen);background:var(--groen-licht);color:var(--groen-diep);font-weight:600}

/* knoppen */
.btn-rij{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:var(--radius-sm);border:1px solid var(--rand-mid);background:var(--wit);cursor:pointer;font-size:14px;color:var(--tekst);font-family:inherit;font-weight:600;transition:all 0.14s}
.btn:hover:not(:disabled){background:#f0f0f0;border-color:#aaa}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-groen{background:var(--groen);color:#fff;border-color:var(--groen)}
.btn-groen:hover:not(:disabled){background:var(--groen-dark)}
.btn-tekst{background:none;border:none;color:var(--tekst-licht);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px}
.btn-tekst:hover{color:var(--tekst-mid)}

/* resultaat */
.resultaat-cijfer{font-size:38px;font-weight:700;color:var(--groen-diep);text-align:center;margin-bottom:4px}
.resultaat-sub{text-align:center;color:var(--tekst-mid);font-size:13px;margin-bottom:1.5rem}
.placeholder-blok{background:var(--amber-licht);color:var(--amber-dark);border-radius:var(--radius-sm);padding:1rem 1.1rem;font-size:13px;margin-top:1rem;line-height:1.55}

.domein-resultaat{margin-bottom:1.1rem}
.domein-resultaat h3{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--tekst-licht);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.begrip-rij{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--rand);border-radius:var(--radius-sm);background:var(--wit);margin-bottom:6px}
.begrip-naam{font-size:13px;color:var(--tekst);font-weight:500}
.status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.status-goed{background:var(--groen-licht);color:var(--groen-diep)}
.status-leren{background:var(--amber-licht);color:var(--amber-dark)}

.cta-blok{background:var(--groen-licht);border:1px solid #b9e6d4;border-radius:var(--radius);padding:1.1rem 1.25rem;margin-top:1.25rem;text-align:center}
.cta-blok p{font-size:14px;color:var(--groen-diep);margin-bottom:0.85rem;font-weight:600}

footer{text-align:center;padding:1.5rem 1rem 0.5rem;font-size:12px;color:var(--tekst-licht)}

@media(max-width:480px){
  .stappen{grid-template-columns:repeat(2,1fr)}
  .stap{font-size:10px}
}
</style>
</head>
<body>

<div class="container" id="app"></div>

/* =====================================================================
 * VOORTGANG: opslaan in localStorage, zodat een student kan stoppen
 * en in een volgende les verdergaat waar hij gebleven was.
 * ===================================================================== */

const STORAGE_KEY = "azureLeertoolVoortgang_v1";

function nieuweState() {
  return {
    fase: "intro", // intro | starttoets | resultaat | leermodule | eindcheck | afgerond
    starttoetsIndex: 0,
    starttoetsAntwoorden: {}, // { begripId: true/false (goed beantwoord) }
    leermoduleVoortgang: {}, // { begripId: true (afgerond) }
    eindcheckIndex: 0,
    eindcheckAntwoorden: {}, // { begripId: true/false }
  };
}

function laadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return nieuweState();
    const opgeslagen = JSON.parse(raw);
    return Object.assign(nieuweState(), opgeslagen);
  } catch (e) {
    return nieuweState();
  }
}

function bewaarState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    /* localStorage niet beschikbaar (bv. privémodus) - voortgang gaat dan niet mee naar volgende les */
  }
}

let state = laadState();

function gemisteBegrippen() {
  return AZURE_BEGRIPPEN.filter((b) => state.starttoetsAntwoorden[b.id] === false);
}

/* =====================================================================
 * HULPFUNCTIES
 * ===================================================================== */

function shuffle(array) {
  const kopie = array.slice();
  for (let i = kopie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
  }
  return kopie;
}

function domeinNaam(domeinId) {
  const d = AZURE_DOMEINEN.find((x) => x.id === domeinId);
  return d ? d.naam : "";
}

function escapeHtml(tekst) {
  const div = document.createElement("div");
  div.textContent = tekst;
  return div.innerHTML;
}

/* =====================================================================
 * RENDER: stappen-voortgangsbalk (bovenaan, altijd zichtbaar)
 * ===================================================================== */

function renderStappenBalk() {
  const stappenDef = [
    { key: "starttoets", label: "Starttoets" },
    { key: "resultaat", label: "Resultaten" },
    { key: "leermodule", label: "Leermodule" },
    { key: "eindcheck", label: "Eindcheck" },
  ];
  const volgordeIndex = { intro: 0, starttoets: 0, resultaat: 1, leermodule: 2, eindcheck: 3, afgerond: 3 };
  const huidigeIndex = volgordeIndex[state.fase] ?? 0;

  const html = stappenDef
    .map((s, i) => {
      let cls = "stap";
      if (i < huidigeIndex) cls += " klaar";
      else if (i === huidigeIndex) cls += " actief";
      return `<div class="${cls}"><span class="stap-nr">${i + 1}</span><br>${s.label}</div>`;
    })
    .join("");

  return `<div class="stappen">${html}</div>`;
}

let huidigeOptieVolgorde = null; // geshuffelde opties voor de huidige vraag, zodat een re-render niet opnieuw schudt

function renderStarttoets() {
  const totaal = AZURE_BEGRIPPEN.length;
  const index = state.starttoetsIndex;
  const begrip = AZURE_BEGRIPPEN[index];
  const percentage = Math.round((index / totaal) * 100);

  if (!huidigeOptieVolgorde || huidigeOptieVolgorde.begripId !== begrip.id) {
    const optiesMetCorrect = begrip.starttoets.opties.map((tekst, i) => ({
      tekst,
      correct: i === begrip.starttoets.correct,
    }));
    huidigeOptieVolgorde = { begripId: begrip.id, opties: shuffle(optiesMetCorrect) };
  }

  const optiesHtml = huidigeOptieVolgorde.opties
    .map(
      (optie, i) => `
      <button class="optie" data-index="${i}">${escapeHtml(optie.tekst)}</button>
    `
    )
    .join("");

  return `
    <div class="subvoortgang-wrap">
      <div class="subvoortgang-labels">
        <span>Starttoets</span>
        <span>Vraag ${index + 1} van ${totaal}</span>
      </div>
      <div class="subvoortgang-bar-bg"><div class="subvoortgang-bar-fill" style="width:${percentage}%"></div></div>
    </div>
    <div class="kaart">
      <div class="domein-badge">${domeinNaam(begrip.domein)}</div>
      <div class="vraag-tekst">${escapeHtml(begrip.starttoets.vraag)}</div>
      <div class="opties">${optiesHtml}</div>
      <div class="btn-rij">
        <button class="btn btn-groen" id="btn-volgende-vraag" disabled>Volgende →</button>
      </div>
    </div>
  `;
}

function koppelStarttoetsEvents() {
  const optieKnoppen = document.querySelectorAll(".optie");
  const volgendeKnop = document.getElementById("btn-volgende-vraag");
  let gekozenIndex = null;

  optieKnoppen.forEach((knop) => {
    knop.addEventListener("click", () => {
      gekozenIndex = parseInt(knop.dataset.index, 10);
      optieKnoppen.forEach((k) => k.classList.remove("geselecteerd"));
      knop.classList.add("geselecteerd");
      volgendeKnop.disabled = false;
    });
  });

  volgendeKnop.addEventListener("click", () => {
    const begrip = AZURE_BEGRIPPEN[state.starttoetsIndex];
    const gekozenOptie = huidigeOptieVolgorde.opties[gekozenIndex];
    state.starttoetsAntwoorden[begrip.id] = !!gekozenOptie.correct;
    huidigeOptieVolgorde = null;

    if (state.starttoetsIndex < AZURE_BEGRIPPEN.length - 1) {
      state.starttoetsIndex += 1;
    } else {
      state.fase = "resultaat";
    }
    bewaarState();
    render();
  });
}

/* =====================================================================
 * SCHERM: RESULTAATOVERZICHT
 * Toont per begrip goed/nog niet gekend, gegroepeerd per domein.
 * "Nog niet gekend"-begrippen worden gemarkeerd voor de leermodule.
 * ===================================================================== */

function renderResultaat() {
  const totaal = AZURE_BEGRIPPEN.length;
  const goed = Object.values(state.starttoetsAntwoorden).filter((v) => v === true).length;
  const gemist = gemisteBegrippen();

  const domeinenHtml = AZURE_DOMEINEN.map((domein) => {
    const begrippenInDomein = AZURE_BEGRIPPEN.filter((b) => b.domein === domein.id);
    const rijenHtml = begrippenInDomein
      .map((b) => {
        const isGoed = state.starttoetsAntwoorden[b.id] === true;
        return `
          <div class="begrip-rij">
            <span class="begrip-naam">${escapeHtml(b.naam)}</span>
            <span class="status-pill ${isGoed ? "status-goed" : "status-leren"}">
              ${isGoed ? "✓ Al bekend" : "Nog leren"}
            </span>
          </div>
        `;
      })
      .join("");
    return `
      <div class="domein-resultaat">
        <h3>${domein.icoon} ${escapeHtml(domein.naam)}</h3>
        ${rijenHtml}
      </div>
    `;
  }).join("");

  const ctaHtml =
    gemist.length > 0
      ? `
        <div class="cta-blok">
          <p>${gemist.length} begrip(pen) ga je nu leren in de leermodule.</p>
          <button class="btn btn-groen" id="btn-naar-leermodule">Ga naar de leermodule →</button>
        </div>
      `
      : `
        <div class="cta-blok">
          <p>Je kende alle 16 begrippen al! Een leermodule is niet nodig.</p>
          <button class="btn btn-groen" id="btn-afronden">Afronden</button>
        </div>
      `;

  return `
    <div class="kaart">
      <div class="resultaat-cijfer">${goed} / ${totaal}</div>
      <div class="resultaat-sub">begrippen al bekend — geen cijfer, puur diagnostisch</div>
      ${domeinenHtml}
      ${ctaHtml}
      <div class="btn-rij" style="margin-top:1rem">
        <button class="btn-tekst" id="btn-reset">Voortgang wissen en opnieuw beginnen</button>
      </div>
    </div>
  `;
}

function koppelResultaatEvents() {
  const naarLeermoduleKnop = document.getElementById("btn-naar-leermodule");
  if (naarLeermoduleKnop) {
    naarLeermoduleKnop.addEventListener("click", () => {
      state.fase = "leermodule";
      bewaarState();
      render();
    });
  }

  const afrondenKnop = document.getElementById("btn-afronden");
  if (afrondenKnop) {
    afrondenKnop.addEventListener("click", () => {
      state.fase = "afgerond";
      bewaarState();
      render();
    });
  }

  const resetKnop = document.getElementById("btn-reset");
  if (resetKnop) {
    resetKnop.addEventListener("click", () => {
      if (confirm("Weet je zeker dat je opnieuw wil beginnen? Je voortgang wordt gewist.")) {
        state = nieuweState();
        bewaarState();
        render();
      }
    });
  }
}

/* =====================================================================
 * HOOFDRENDER
 * ===================================================================== */

function render() {
  const app = document.getElementById("app");
  let inhoud = "";

  inhoud += `
    <div class="site-header">
      <h1>Azure basisbegrippen</h1>
      <p>Voorbereiding op je ICT-stage — herken de begrippen op de servicedesk</p>
    </div>
  `;

  if (state.fase !== "intro") {
    inhoud += renderStappenBalk();
  }

  if (state.fase === "intro") {
    inhoud += renderIntro();
  } else if (state.fase === "starttoets") {
    inhoud += renderStarttoets();
  } else if (state.fase === "resultaat") {
    inhoud += renderResultaat();
  } else if (state.fase === "leermodule") {
    inhoud += renderVolgendeStapStub("De leermodule", "stap 4/5");
  } else if (state.fase === "eindcheck") {
    inhoud += renderVolgendeStapStub("De eindcheck", "stap 5/5");
  } else if (state.fase === "afgerond") {
    inhoud += renderAfgerond();
  }

  inhoud += `<footer>Ter AA Helmond — Medewerker ICT niveau 2</footer>`;

  app.innerHTML = inhoud;

  if (state.fase === "intro") {
    document.getElementById("btn-start-toets").addEventListener("click", () => {
      state.fase = "starttoets";
      bewaarState();
      render();
    });
  } else if (state.fase === "starttoets") {
    koppelStarttoetsEvents();
  } else if (state.fase === "resultaat") {
    koppelResultaatEvents();
  } else if (state.fase === "leermodule" || state.fase === "eindcheck") {
    koppelStubEvents();
  } else if (state.fase === "afgerond") {
    koppelStubEvents();
  }
}

render();
</script>
</body>
</html>
