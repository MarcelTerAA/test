<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn doorstroomkeuze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ter AA huisstijl */
  --basis:#EFA242;
  --oranje:#FF5900; --groen:#90F87B; --paars:#9447F0; --geel:#FADE29;
  --l-geel:#FFE398; --l-zalm:#F8CBAF; --l-mint:#A6EBC7; --l-lila:#E5C7FE; --l-blauw:#B2C6D3;
  --m-zalm:#FF996E; --m-groen:#26C373; --m-lila:#D594FF; --m-blauw:#6698AD;
  --d-oker:#CD963C; --d-oranje:#D2652A; --d-groen:#3D6B52; --d-paars:#5A4494; --d-grijs:#53666B;
  --tekst:#1E2426; --zacht:#53666B; --lijn:#E4E1DA; --bg:#FFFFFF; --vlak:#FBF8F2;
  --accent:var(--basis); --accent-l:var(--l-geel); --accent-d:var(--d-oker);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font-family:Poppins,Arial,sans-serif;color:var(--tekst);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:0 16px 80px;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;gap:12px}
.logo{color:var(--basis);height:34px;display:block}
.logo svg{height:100%;width:auto;display:block}
.top-r{font-size:13px;color:var(--zacht);text-align:right}
.voortgang{height:8px;background:var(--vlak);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.voortgang i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease,background .3s}
.deelbalk{display:flex;gap:6px;font-size:12px;color:var(--zacht);margin-bottom:18px;flex-wrap:wrap}
.deelbalk span{padding:2px 10px;border-radius:99px;background:var(--vlak)}
.deelbalk span.nu{background:var(--accent-l);color:var(--tekst);font-weight:600}
.deelbalk span.klaar{opacity:.55}

.scherm{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);margin-bottom:6px}
h1{font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em}
h2{font-weight:600;font-size:clamp(21px,4.4vw,27px);line-height:1.25;margin:0 0 10px}
h3{font-weight:600;font-size:17px;margin:0 0 6px}
p{margin:0 0 12px}
.hint{color:var(--zacht);font-size:14px}
.kaart{background:#fff;border:1.5px solid var(--lijn);border-radius:18px;padding:20px}

/* hero */
.hero{position:relative;background:var(--l-geel);border-radius:24px;padding:34px 26px 28px;overflow:hidden;margin-bottom:20px}
.hero .grootA{position:absolute;right:-30px;bottom:-26px;width:250px;color:var(--basis);opacity:.9;pointer-events:none}
.hero .grootA svg{width:100%;height:auto;display:block}
.hero > *:not(.grootA){position:relative;z-index:1;max-width:470px}
.hero p{font-size:16px}
.stappen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stap{background:var(--vlak);border-radius:14px;padding:12px 14px;font-size:14px}
.stap b{display:block;font-size:13px;color:var(--d-oker)}
.velden{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:16px 0}
@media (max-width:520px){.velden{grid-template-columns:1fr}.hero .grootA{width:170px;opacity:.55}}
label.veld{display:block;font-size:13px;font-weight:500}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--lijn);border-radius:12px;padding:11px 13px;background:#fff;margin-top:4px;outline:none;transition:border-color .2s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical;line-height:1.5}

/* knoppen */
.knop{border:0;border-radius:99px;padding:13px 24px;font-weight:600;cursor:pointer;background:var(--tekst);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,opacity .2s;text-decoration:none}
.knop:hover{transform:translateY(-1px)}
.knop:disabled{opacity:.35;cursor:not-allowed;transform:none}
.knop.oranje{background:var(--oranje);color:#fff}
.knop.licht{background:var(--vlak);color:var(--tekst)}
.knop.rand{background:#fff;border:1.5px solid var(--lijn);color:var(--tekst)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.terug{background:none;border:0;cursor:pointer;color:var(--zacht);padding:8px 4px;font-size:15px}
.terug:hover{color:var(--tekst)}

/* opties */
.opties{display:grid;gap:10px;margin-top:16px}
.optie{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--lijn);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.optie:hover{border-color:var(--accent)}
.optie.aan{border-color:var(--accent);background:var(--accent-l)}
.optie .ico{font-size:26px;width:36px;text-align:center;flex:none}
.optie .tx b{display:block;font-weight:600}
.optie .tx small{color:var(--zacht);font-size:13.5px}
.optie .vink{margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--lijn);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.optie.aan .vink{background:var(--tekst);border-color:var(--tekst)}
.opties.twee{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opties.twee{grid-template-columns:1fr}}

.emoji{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.emoji button{border:2px solid var(--lijn);background:#fff;border-radius:16px;padding:14px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--zacht);transition:.15s}
.emoji button span{font-size:clamp(28px,7vw,40px);line-height:1;filter:grayscale(.3)}
.emoji button:hover{border-color:var(--accent)}
.emoji button.aan{border-color:var(--accent);background:var(--accent-l);color:var(--tekst);font-weight:600}
.emoji button.aan span{filter:none;transform:scale(1.12)}

/* stelling */
.stelling{background:var(--accent-l);border-radius:22px;padding:28px 24px;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.stelling .nr{font-size:12px;font-weight:600;color:var(--accent-d);letter-spacing:.05em;text-transform:uppercase}
.stelling h2{margin:6px 0 0;max-width:600px}
.schaal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.schaal button{border:2px solid var(--lijn);background:#fff;border-radius:14px;padding:14px 6px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.25;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.schaal button i{font-style:normal;font-size:22px}
.schaal button:hover{border-color:var(--accent)}
.schaal button.aan{background:var(--tekst);color:#fff;border-color:var(--tekst)}
@media (max-width:480px){.schaal{grid-template-columns:1fr 1fr}}

/* tussenscherm */
.tussen{border-radius:24px;padding:36px 26px;position:relative;overflow:hidden;background:var(--accent-l)}
.tussen .grootA{position:absolute;right:-20px;top:-10px;width:200px;color:var(--accent);opacity:.5}
.tussen .grootA svg{width:100%;height:auto}
.tussen > *:not(.grootA){position:relative}
.tussen .deelnr{font-size:64px;font-weight:700;line-height:1;color:var(--accent-d)}

/* uitslag */
.balken{display:grid;gap:10px;margin:16px 0 8px}
.balk{display:grid;grid-template-columns:minmax(120px,190px) 1fr 46px;align-items:center;gap:10px;font-size:14px}
.balk .bk{height:16px;background:var(--vlak);border-radius:99px;overflow:hidden}
.balk .bk i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.balk b{text-align:right;font-weight:600}
@media (max-width:480px){.balk{grid-template-columns:1fr 46px}.balk .bk{grid-column:1/-1;grid-row:2}}
.top1{border-radius:22px;padding:24px;position:relative;overflow:hidden;margin:18px 0}
.top1 .grootA{position:absolute;right:-24px;bottom:-30px;width:180px;opacity:.35}
.top1 .grootA svg{width:100%;height:auto}
.top1 > *:not(.grootA){position:relative}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:99px;background:#fff;margin:0 6px 6px 0}
.top1 ul{margin:8px 0 12px;padding-left:20px}
.top1 li{margin-bottom:3px}
.redenen{background:var(--vlak);border-radius:16px;padding:16px 18px;margin:14px 0}
.redenen ul{margin:6px 0 0;padding-left:20px}
.route{border-left:5px solid var(--accent);background:#fff;padding:12px 16px;border-radius:0 14px 14px 0;margin:14px 0;box-shadow:0 0 0 1.5px var(--lijn) inset}
.link{color:var(--tekst);font-weight:600;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.andere{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:560px){.andere{grid-template-columns:1fr}}
.andere .kaart{padding:14px 16px}
.andere .kaart b{display:block}
.andere .kaart small{color:var(--zacht)}

/* eindscherm */
.eind{background:var(--tekst);color:#fff;border-radius:24px;padding:26px 24px;position:relative;overflow:hidden}
.eind .grootA{position:absolute;right:-30px;top:-20px;width:220px;color:var(--basis);opacity:.25}
.eind .grootA svg{width:100%;height:auto}
.eind > *:not(.grootA){position:relative}
.eind .label{color:var(--l-geel)}
.eind h2{color:#fff}
.vak{margin:16px 0}
.vak > label{font-weight:600;font-size:14.5px;display:block}
.vak .hint{margin:2px 0 4px;font-size:13px}
.checks{display:grid;gap:6px;margin-top:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer;padding:6px 2px}
.checks input{width:19px;height:19px;accent-color:var(--oranje);margin-top:3px;flex:none}
.acties{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.melding{font-size:14px;color:var(--d-groen);margin-top:10px;min-height:20px}
.klein{font-size:13px;color:var(--zacht)}
footer{margin-top:40px;font-size:12.5px;color:var(--zacht);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--zacht);cursor:pointer;text-decoration:underline;padding:0;font-size:12.5px}

/* ===== Geen-scroll layout: alles past in het scherm, navigatie altijd zichtbaar ===== */
html,body{height:100%}
body{min-height:0;overflow:hidden}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 16px;max-width:820px}
header.top{padding:10px 0 4px;flex:none}
.logo{height:28px}
.top-r{display:flex;align-items:center;gap:14px}
.top-r button{background:none;border:0;color:var(--zacht);cursor:pointer;text-decoration:underline;padding:0;font-size:12.5px}
.voortgang{flex:none;margin:4px 0 4px}
.deelbalk{flex:none;margin-bottom:10px}
main#scherm{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 2px 8px;display:flex;flex-direction:column}
main#scherm > .scherm{margin:auto 0}
#navbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 14px;border-top:1.5px solid var(--lijn)}
#navbar .rechts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#navbar .knop{padding:12px 22px}
h1{font-size:clamp(26px,5vw,38px);margin-bottom:10px}
h2{font-size:clamp(19px,3.6vw,24px);margin-bottom:6px}
p{margin-bottom:8px}
.hero{padding:22px 24px 18px;margin-bottom:12px}
.hero .grootA{width:190px;bottom:-22px}
.stappen{margin:10px 0;gap:8px}
.stap{padding:9px 12px;font-size:13px}
.velden{margin:10px 0 0}
.opties{gap:8px;margin-top:12px}
.optie{padding:10px 14px;gap:12px;border-radius:14px}
.optie .ico{font-size:22px;width:30px}
.optie .tx small{font-size:13px;line-height:1.35;display:block}
@media (min-width:700px){.opties.veel{grid-template-columns:1fr 1fr}}
.emoji{margin-top:14px}
.stelling{padding:22px 22px;min-height:120px}
.schaal{margin-top:12px}
.schaal button{padding:12px 6px}
.tussen{padding:28px 24px}
.tussen .deelnr{font-size:54px}
.balken{gap:8px;margin:10px 0 6px}
.top1{padding:20px 22px;margin:4px 0 0}
.top1 ul{margin:4px 0 8px}
.kolommen{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
@media (max-width:620px){.kolommen{grid-template-columns:1fr}}
.redenen{margin:10px 0 0;padding:14px 18px}
.route{margin:6px 0 0}
.nr2{display:flex;gap:14px;align-items:center;border-radius:16px;padding:12px 16px;margin-top:12px}
.nr2 b{display:block}
.eind{padding:16px 20px;border-radius:18px}
.eind .grootA{width:140px;top:-14px}
.vak{margin:10px 0}
.checks{gap:2px}
.checks label{padding:4px 2px}
textarea{min-height:80px}
textarea.groot{min-height:170px;height:30vh}
.melding{margin-top:6px;min-height:0}
.melding:empty{display:none}
@media (max-height:700px){.stappen{display:none}.hero p{font-size:15px}}
@media (max-width:520px){.top-r #wie{display:none}}
@media (min-width:621px){.checks{grid-template-columns:1fr 1fr}}
.eind{padding:12px 18px}
.top1{padding:16px 20px}
.top1 li{margin-bottom:1px}
.top1 p{margin-bottom:6px}
/* compacte modus voor lage schermen (kleine laptops, ingezoomd) */
@media (max-height:640px){
  header.top{padding:6px 0 2px}.logo{height:24px}
  .deelbalk{display:none!important}.voortgang{margin:2px 0 8px;height:6px}
  h1{font-size:clamp(24px,4vw,30px);margin-bottom:6px}
  h2{font-size:clamp(18px,3vw,21px)}
  .label{margin-bottom:2px}
  .hint{font-size:13px}
  .optie{padding:7px 12px}.opties{gap:6px;margin-top:8px}
  .balken{gap:5px;margin:6px 0 4px}.balk .bk{height:13px}
  .redenen{padding:10px 16px;margin-top:8px}.redenen ul{margin-top:2px}
  .top1{padding:12px 18px}.top1 .chip{margin-bottom:2px}
  .kolommen p,.top1 p{margin-bottom:4px;font-size:15px}.top1 li{font-size:15px}
  .checks label{padding:2px}.vak{margin:6px 0}
  #navbar{padding:7px 0 9px}#navbar .knop{padding:10px 20px}
  .stelling{min-height:100px;padding:18px 20px}
  .hero{padding:16px 22px 14px}
}
/* telefoon: compacte keuzetegels */
@media (max-width:560px){
  .deelbalk{display:none!important}.voortgang{margin:2px 0 10px}
  h2{font-size:19px}
  .optie{position:relative;padding:8px 12px;gap:10px}
  .optie .tx b{font-size:14.5px;line-height:1.3}
  .optie .tx small{display:none}
  .optie .ico{font-size:20px;width:26px}
  .opties.twee{grid-template-columns:1fr 1fr;gap:6px}
  .opties.twee .optie{flex-direction:column;text-align:center;padding:8px 6px;gap:2px;justify-content:center}
  .opties.twee .optie .vink{position:absolute;top:5px;right:5px;width:18px;height:18px;font-size:11px;border-radius:5px}
  .opties.twee .optie .tx b{font-size:13.5px}
  .schaal button{padding:9px 4px;font-size:13px}
  .stelling{min-height:0;padding:18px}
  .hero .grootA{width:120px;opacity:.4}
}
@media print{header.top .top-r,.voortgang,.deelbalk,#navbar{display:none}body{overflow:visible}.app{height:auto}.eind{background:#fff;color:#000;border:2px solid #000}.eind h2{color:#000}}
</style>
</head>

/* ---------- Status ---------- */
let st = laad();
function zet(id,val){ if(JSON.stringify(st.a[id])!==JSON.stringify(val)) st.keuze=null; st.a[id]=val; bewaar(); }
function laad(){
  try{ const x = JSON.parse(localStorage.getItem(OPSLAG)); if(x && x.a) return x; }catch(e){}
  return {stap:0, naam:'', klas:'', a:{}, refl:{}, keuze:null};
}
function bewaar(){ try{ localStorage.setItem(OPSLAG, JSON.stringify(st)); }catch(e){} }

function zichtbaar(){
  return VRAGEN.filter(v => {
    if(v.alleenAls==='anders') return toonAnders();
    return true;
  });
}
function toonAnders(){
  const a = st.a;
  if(a.plan==='anders' || (a.leuk && a.leuk<=2) || (a.s13!==undefined && a.s13>=2) || (a.hoogte||[]).includes('niks')) return true;
  const sc = scores(); return sc.rang[0].k==='anders' || sc.pct.anders >= 45;
}

/* ---------- Scores ---------- */
const HOOFD = ['sup','sys','soft','game','anders'];
function scores(){
  const raw = {}, max = {}, bijdrage = {};
  const add = (obj,f,reden,qid) => { for(const k in obj){ raw[k]=(raw[k]||0)+obj[k]*f; if(reden && obj[k]*f>0){ (bijdrage[k]=bijdrage[k]||[]).push({w:obj[k]*f, r:reden, q:qid}); } } };
  const addMax = (objs) => { const m={}; objs.forEach(o=>{ for(const k in o) m[k]=Math.max(m[k]||0,o[k]); }); for(const k in m) max[k]=(max[k]||0)+m[k]; };
  for(const v of VRAGEN){
    const ant = st.a[v.id];
    if(v.type==='schaal' && v.s){ addMax([v.s]); if(ant!==undefined) add(v.s, SCHAAL[ant].f, v.r, v.id); }
    else if((v.type==='single'||v.type==='multi') && v.opts && v.opts.some(o=>o.s)){
      if(v.type==='multi'){ // max = beste 'max' opties per richting, benaderd met 2 beste
        const per={}; v.opts.forEach(o=>{ for(const k in (o.s||{})) (per[k]=per[k]||[]).push(o.s[k]); });
        for(const k in per){ const t=per[k].sort((x,y)=>y-x).slice(0,2).reduce((x,y)=>x+y,0); max[k]=(max[k]||0)+t; }
        (ant||[]).forEach(val=>{ const o=v.opts.find(o=>o.v===val); if(o&&o.s) add(o.s,1,o.r,v.id); });
      } else {
        addMax(v.opts.map(o=>o.s||{}));
        const o = v.opts.find(o=>o.v===ant); if(o&&o.s) add(o.s,1,o.r,v.id);
      }
    }
  }
  // Hoe leuk is ICT?
  if(st.a.leuk){ const l=st.a.leuk; const ictBonus=[0,-3,-1,0,1,2][l]; for(const k of ['sup','sys','soft','game']) raw[k]=(raw[k]||0)+ictBonus; raw.anders=(raw.anders||0)+[0,6,3,0,0,0][l];
    if(l<=2) (bijdrage.anders=bijdrage.anders||[]).push({w:6-l*2, r:'ik vind ICT op dit moment '+(l===1?'echt niet':'maar matig')+' leuk', q:'leuk'}); }
  max.anders=(max.anders||0)+6; for(const k of ['sup','sys','soft','game']) max[k]=(max[k]||0)+2;
  const pct={}; for(const k of HOOFD){ pct[k]=Math.max(0,Math.min(100,Math.round(100*(raw[k]||0)/(max[k]||1)))); }
  // anders iets afzwakken als ICT leuk is
  const rang = HOOFD.map(k=>({k,p:pct[k]})).sort((x,y)=>y.p-x.p);
  const sub = {cloud:raw.cloud||0, cyber:raw.cyber||0, net:raw.net||0, fs:raw.fs||0};
  return {raw,max,pct,rang,bijdrage,sub};
}
function niveauScore(){ const a=st.a; return (a.school??1)+(a.zelf??1)+(a.theorie??1); } // 0..6
function specialisatie(k, sc){
  if(k==='sys'){
    const s=[['cloud',sc.sub.cloud],['cyber',sc.sub.cyber],['net',sc.sub.net]].sort((x,y)=>y[1]-x[1]);
    if(s[0][1]>=3 && s[0][1]>s[1][1]) return s[0][0];
    return null;
  }
  if(k==='soft' && sc.sub.fs>=4) return 'fs';
  return null;
}
function engels(){ return (st.a.s14??0)>=2; }

function route(k, sc){
  const n = niveauScore(), a=st.a;
  const r = [];
  if(k==='anders'){
    r.push('Kijk welke opleiding buiten de ICT bij je past. Vaak kun je met je niveau 2-diploma instromen op niveau 3 in een andere richting. Check de toelatingseisen per opleiding.');
  } else if(k==='sup'){
    r.push('Met je niveau 2-diploma kun je instromen in <b>ICT support technician</b> (niveau 3, 2 jaar).');
    r.push('Daarna kun je nog doorstromen naar niveau 4, bijvoorbeeld ICT System Engineer of Software engineer.');
  } else {
    if(n>=5){
      r.push(`Je antwoorden laten zien dat je goed zelfstandig leert. Ter AA noemt <b>${TR[k].naam}</b> (niveau 4) als mogelijke vervolgstap. Bespreek met je SLB'er of je direct op niveau 4 kunt instromen.`);
      r.push('Een veilige route blijft: eerst ICT support technician (niveau 3), daarna niveau 4.');
    } else {
      r.push(`De meest logische route is <b>eerst ICT support technician</b> (niveau 3, 2 jaar) en daarna doorstromen naar <b>${TR[k].naam}</b> (niveau 4).`);
      r.push('Zo bouw je stap voor stap verder en heb je onderweg al een niveau 3-diploma op zak.');
    }
  }
  if(a.jaren==='kort') r.push('Je wilt snel aan het werk. Niveau 3 duurt 2 jaar en je loopt veel stage. Je kunt ook eerst gaan werken met je niveau 2-diploma en later verder leren.');
  if(a.plan==='werk') r.push('Je gaf aan dat je wilt gaan werken. Dat kan met je niveau 2-diploma! De ICT-opleidingen bij Ter AA zijn wel allemaal BOL (school + stage), niet BBL.');
  if(a.jaren==='lang' && k!=='anders') r.push('Wil je later naar het hbo? Daarvoor heb je een niveau 4-diploma nodig.');
  return r;
}
function redenen(k, sc){
  const lijst = (sc.bijdrage[k]||[]).slice().sort((x,y)=>y.w-x.w);
  const gezien=new Set(), uit=[];
  for(const b of lijst){ if(!gezien.has(b.r)){ gezien.add(b.r); uit.push(b.r); } if(uit.length>=4) break; }
  return uit;
}

/* ---------- Render ---------- */
const $ = s => document.querySelector(s);
const el = $('#scherm');
const NIET_VRAAG = ['intro','tussen'];
const EIND_TYPES = ['uitslag','advies','routeScherm','refl','keuze','waarom','afronden'];
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function zetDeel(d){
  const kl = d? DELEN[d-1].kleur : ['#EFA242','#FFE398','#CD963C'];
  const r=document.documentElement.style; r.setProperty('--accent',kl[0]); r.setProperty('--accent-l',kl[1]); r.setProperty('--accent-d',kl[2]);
}
function render(){
  const lijst = zichtbaar();
  if(st.stap>=lijst.length) st.stap=lijst.length-1;
  const v = lijst[st.stap];
  zetDeel(v.deel);
  $('#wie').innerHTML = st.naam ? esc(st.naam)+(st.klas?' · '+esc(st.klas):'') : '';
  const vragenTot = lijst.filter(x=>!NIET_VRAAG.includes(x.type));
  $('#vgWrap').hidden = v.type==='intro';
  $('#deelbalk').hidden = v.type==='intro';
  const klaar = lijst.slice(0,st.stap).filter(x=>!NIET_VRAAG.includes(x.type)).length;
  $('#vg').style.width = Math.round(100*klaar/vragenTot.length)+'%';
  $('#deelbalk').innerHTML = DELEN.map(d=>`<span class="${d.nr===v.deel?'nu':(d.nr<v.deel?'klaar':'')}">${d.nr<v.deel?'✓ ':''}${d.nr}. ${d.titel}</span>`).join('');
  const f = {intro,tussen,emoji,multi,single,schaal,uitslag,advies,routeScherm,refl,keuze,waarom,afronden}[v.type];
  el.innerHTML = ''; $('#navbar').innerHTML = '';
  const div = document.createElement('div'); div.className='scherm';
  el.appendChild(div);
  f(v, div);
  el.scrollTop = 0;
  bewaar();
}
function volgende(){ st.stap++; render(); }
function vorige(){ if(st.stap>0){ st.stap--; render(); } }
/* De navigatie staat altijd onderaan in beeld (#navbar), los van de inhoud */
function nav(div, kanVerder, tekst='Volgende →', extra=''){

  n.querySelector('.terug').onclick = vorige; n.querySelector('#verder').onclick = volgende;
  return n.querySelector('#verder');
}

}
function single(v, d){
  d.innerHTML = kop(v)+`<div class="opties ${v.opts.length>4?'veel':''}">${v.opts.map(o=>optieHTML(o, st.a[v.id]===o.v)).join('')}</div>`;
  const b = nav(d, st.a[v.id]!==undefined);
  d.querySelectorAll('.optie').forEach(x=>x.onclick=()=>{
    const o = v.opts.find(o=>String(o.v)===x.dataset.v); zet(v.id,o.v);
    d.querySelectorAll('.optie').forEach(y=>y.classList.toggle('aan',y===x)); b.disabled=false; setTimeout(volgende,350);
  });
}
function multi(v, d){
  const sel = new Set(st.a[v.id]||[]);
  d.innerHTML = kop(v)+`<div class="opties twee">${v.opts.map(o=>optieHTML(o, sel.has(o.v), true)).join('')}</div>`;
  const b = nav(d, sel.size>0);
  d.querySelectorAll('.optie').forEach(x=>x.onclick=()=>{
    const val=x.dataset.v;
    if(sel.has(val)) sel.delete(val); else { if(sel.size>=v.max){ const eerste=[...sel][0]; sel.delete(eerste); d.querySelector(`.optie[data-v="${eerste}"]`).classList.remove('aan'); } sel.add(val); }
    x.classList.toggle('aan', sel.has(val)); zet(v.id,[...sel]); b.disabled = sel.size===0;
  });

function schaal(v, d){
  const stell = VRAGEN.filter(x=>x.type==='schaal'); const nr = stell.indexOf(v)+1;

/* ---------- Uitslag (verdeeld over 3 schermen) ---------- */

  const t=TR[k];
  return t.niveau?`<span class="chip">${t.niveau}</span><span class="chip">${t.duur}</span><span class="chip">BOL</span><span class="chip">${sc.pct[k]}% match</span>`:`<span class="chip">${sc.pct[k]}% match</span>`;
}
function uitslag(v, d){
  const sc = scores(); const top = sc.rang[0].k;
  const red = redenen(top, sc);
  d.innerHTML = `<span class="label">Uitslag 1 van 3</span><h1>${esc(st.naam||'Jouw')}${st.naam?', dit':'Dit'} past bij jou</h1>
    <p class="hint">Zo scoren de richtingen op basis van jouw antwoorden. Het is een advies, geen eindoordeel: jij beslist.</p>
    <div class="balken">${sc.rang.map(r=>`<div class="balk"><span>${TR[r.k].kort}${TR[r.k].niveau?` <span class="klein">(${TR[r.k].niveau.replace('Niveau ','N')})</span>`:''}</span><div class="bk"><i style="background:${TR[r.k].kleur}" data-w="${r.p}"></i></div><b>${r.p}%</b></div>`).join('')}</div>
    ${red.length?`<div class="redenen" style="border-left:5px solid ${TR[top].kleur}"><b>Waarom ${esc(TR[top].kort)}?</b> Je gaf onder andere aan:<ul>${red.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}`;
  setTimeout(()=>d.querySelectorAll('.bk i').forEach(i=>i.style.width=i.dataset.w+'%'),80);
  nav(d, true, 'Bekijk je beste match →');
}
function advies(v, d){
  const sc = scores(); const k = sc.rang[0].k; const t = TR[k]; const sp = specialisatie(k, sc);
  let h = `<span class="label">Uitslag 2 van 3 · jouw beste match</span>
    <section class="top1" style="background:${t.licht}"><div class="grootA" style="color:${t.kleur}">${A_SVG}</div>
    <h2 style="margin-bottom:6px">${esc(t.naam)}</h2>${chips(k, sc)}`;
  if(k!=='anders'){
    h += `<div class="kolommen" style="margin-top:6px">
        <div><b>Wat leer je?</b><ul>${t.wat.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>

    if(sp) h += `<p>🎯 <b>Specialisatie-tip: ${SPEC[sp].naam}</b>. Daarin leer je ${SPEC[sp].tx}. <a class="link" href="${SPEC[sp].url}" target="_blank" rel="noopener">Bekijk</a></p>`;
    else if(k==='sys') h += `<p class="hint">Binnen deze opleiding kun je je specialiseren in Cloud, Cyber security of Netwerken.</p>`;
    const tw = TWEETALIG[sp==='fs'?'fs':k];
    if(tw && engels()) h += `<p>🇬🇧 Je vindt Engels prima: deze opleiding bestaat ook <b>tweetalig</b>. <a class="link" href="${tw.url}" target="_blank" rel="noopener">${tw.naam}</a></p>`;
    h += `<a class="link" href="${t.url}" target="_blank" rel="noopener">Meer op ter-aa.nl →</a>`;
  } else {
    h += `<p style="margin-top:10px">${esc(t.past)} Je kunt ook een andere vervolgopleiding kiezen.</p>`;
    const r = st.a.richting||[];
    if(r.length){ h += `<div class="andere">${r.map(x=>`<div class="kaart"><b>${RICHTING[x].ico} ${RICHTING[x].b}</b><small>${RICHTING[x].tip}</small></div>`).join('')}</div>`; }
    h += `<p style="margin-top:10px"><a class="link" href="${t.url}" target="_blank" rel="noopener">Alle mbo-opleidingen van Ter AA →</a></p>`;
  }
  d.innerHTML = h+'</section>';
  nav(d, true, 'Jouw route →');
}
function routeScherm(v, d){
  const sc = scores(); const k = sc.rang[0].k; const t=TR[k];
  const k2 = sc.rang[1].k, t2 = TR[k2];
  const toon2 = sc.rang[1].p>=Math.max(35, sc.rang[0].p-15);
  d.innerHTML = `<span class="label">Uitslag 3 van 3</span>
    <h2>${k==='anders'?'Hoe ga je verder?':`Hoe kom je bij ${esc(t.naam)}?`}</h2>
    <div class="route" style="border-left-color:${t.kleur}">${route(k,sc).map(r=>`<p style="margin:4px 0">${r}</p>`).join('')}</div>
    ${toon2?`<div class="nr2" style="background:${t2.licht}"><span style="font-size:28px">🥈</span><div><span class="klein">Ook dichtbij: nummer 2 (${sc.rang[1].p}%)</span><b>${esc(t2.naam)}${t2.niveau?' · '+t2.niveau:''}</b><span class="klein">${esc(k2==='anders'?t2.past:t2.werk)}</span> <a class="link" href="${t2.url}" target="_blank" rel="noopener">Bekijk →</a></div></div>`:''}`;
  nav(d, true, 'Naar reflectie →');
}

const REFL = [
  {id:'klopt', l:'Klopt deze uitslag met hoe jij jezelf ziet? Waarom wel of niet?', h:'Denk aan je stage, lessen en wat je in je vrije tijd doet.'},
  {id:'twijfel', l:'Waar twijfel je nog over? Wat heb je nog nodig om zeker te zijn?', h:'Bijvoorbeeld: meer informatie, een open dag, praten met een student of met je ouders.'},
  {id:'sterk', l:'Welke eigenschap van jou helpt je straks in je vervolgopleiding of werk?', h:'Bijvoorbeeld: doorzetten, goed met mensen, nauwkeurig, creatief…'}
];
function refl(v, d){
  const r = REFL[v.ri];
  d.innerHTML = `<span class="label">Reflectie ${v.ri+1} van ${REFL.length}</span><h2>${r.l}</h2><p class="hint">${r.h} Je antwoord komt mee in je e-mail. Kort mag, maar wees eerlijk.</p>
    <textarea id="r_${r.id}" class="groot" aria-label="${esc(r.l)}">${esc(st.refl[r.id]||'')}</textarea>`;
  const ta = d.querySelector('textarea'); ta.oninput=e=>{ st.refl[r.id]=e.target.value; bewaar(); };
  setTimeout(()=>ta.focus(),60);
  nav(d, true, v.ri<REFL.length-1 ? 'Volgende vraag →' : 'Naar mijn keuze →');
}

/* ---------- Keuze (verdeeld over 3 schermen) ---------- */
const KEUZES = [
  ['ICT-opleidingen bij Ter AA', [
    'ICT support technician (niveau 3)','ICT System Engineer (niveau 4)','Cloud specialist (niveau 4)','Cyber security specialist (niveau 4)','Network specialist (niveau 4)',
    'Software engineer (niveau 4)','Software engineer tweetalig (niveau 4)','Full stack developer (niveau 4)','Full stack developer tweetalig (niveau 4)','Game developer (niveau 4)','Game developer tweetalig (niveau 4)']],
  ['Iets anders', ['Een opleiding buiten de ICT','Gaan werken','Ik weet het nog niet']]
];
const STAPPEN = ['Open dag of meeloopdag bezoeken','De opleidingspagina op ter-aa.nl goed lezen','Praten met een student of docent van die opleiding','Thuis bespreken met ouders/verzorgers','Gesprek plannen met mijn SLB\'er','Aanmelden voor de vervolgopleiding'];
function standaardKeuze(){
  const sc=scores(); const k=sc.rang[0].k; const sp=specialisatie(k,sc);
  let opl;
  if(k==='sup') opl='ICT support technician (niveau 3)';
  else if(k==='sys') opl = sp ? SPEC[sp].naam+' (niveau 4)' : 'ICT System Engineer (niveau 4)';
  else if(k==='soft') opl = (sp==='fs'?'Full stack developer':'Software engineer')+(engels()?' tweetalig':'')+' (niveau 4)';
  else if(k==='game') opl = 'Game developer'+(engels()?' tweetalig':'')+' (niveau 4)';
  else opl = st.a.plan==='werk' ? 'Gaan werken' : 'Een opleiding buiten de ICT';
  const n = niveauScore();
  let rt = '';
  if(['sys','soft','game'].includes(k)) rt = n>=5 ? 'Eerst bespreken of ik direct op niveau 4 kan instromen; anders eerst ICT support technician (niveau 3).' : 'Eerst ICT support technician (niveau 3), daarna doorstromen naar niveau 4.';
  else if(k==='sup') rt = 'Na mijn niveau 2-diploma instromen op niveau 3. Daarna misschien door naar niveau 4.';
  let anders = '';
  if(k==='anders' && (st.a.richting||[]).length) anders = (st.a.richting||[]).filter(x=>x!=='weetniet').map(x=>RICHTING[x].b).join(', ');
  const red = redenen(k, sc);
  let w = red.length ? 'Ik kies hiervoor, want '+(red.length>1? red.slice(0,-1).join(', ')+' en '+red[red.length-1] : red[0])+'.' : '';
  if(st.a.leuk) w += ` Ik vind ICT nu ${st.a.leuk} uit 5 leuk.`;
  return {opl, anders, route:rt, waarom:w.trim(), stappen:[], extra:''};
}
function zorgKeuze(){ if(!st.keuze){ st.keuze = standaardKeuze(); bewaar(); } return st.keuze; }
function keuzeBanner(k){
  return `<section class="eind"><div class="grootA">${A_SVG}</div><span class="label">Mijn doorstroomkeuze</span>
    <h2 style="font-size:clamp(20px,4vw,26px);margin:0" id="kopKeuze">${esc(k.opl)}</h2></section>`;
}
function keuze(v, d){
  const k = zorgKeuze(); const sc=scores();
  const opties = KEUZES.map(([g,l])=>`<optgroup label="${g}">${l.map(o=>`<option ${o===k.opl?'selected':''}>${esc(o)}</option>`).join('')}</optgroup>`).join('');
  d.innerHTML = `<span class="label">Keuze 1 van 3</span>${keuzeBanner(k)}
    <p class="hint" style="margin-top:10px">De app heeft alvast een voorstel ingevuld (beste match: ${TR[sc.rang[0].k].naam}, ${sc.rang[0].p}%). <b>Pas alles aan</b> zodat het echt jouw keuze is.</p>
    <div class="kolommen"><div class="vak" style="margin-bottom:0"><label for="k_opl">Mijn keuze</label><select id="k_opl">${opties}</select></div>
    <div class="vak" id="vakAnders" style="margin-bottom:0"><label for="k_anders">Welke richting precies?</label><input type="text" id="k_anders" maxlength="120" value="${esc(k.anders)}"></div></div>
    <div class="vak"><label for="k_route">Mijn route <span class="klein" style="font-weight:400">(bijv. eerst niveau 3, daarna niveau 4)</span></label><textarea id="k_route" style="min-height:64px">${esc(k.route)}</textarea></div>`;
  const toonAnders=()=>{ $('#vakAnders').style.display = KEUZES[1][1].includes(k.opl) ? '' : 'none'; };
  toonAnders();
  $('#k_opl').onchange=e=>{ k.opl=e.target.value; $('#kopKeuze').textContent=k.opl; toonAnders(); bewaar(); };
  ['anders','route'].forEach(f=>{ $('#k_'+f).oninput=e=>{ k[f]=e.target.value; bewaar(); }; });
  nav(d, true, 'Onderbouwing →');
}
function waarom(v, d){
  const k = zorgKeuze();
  d.innerHTML = `<span class="label">Keuze 2 van 3</span><h2>Waarom kies je voor ${esc(k.opl.replace(/ \(niveau \d\)/,''))}?</h2>
    <p class="hint">Noem minstens 2 redenen en gebruik voorbeelden uit je stage, lessen of hobby's. De app heeft een begin gemaakt: maak er jouw eigen verhaal van.</p>
    <textarea id="k_waarom" class="groot" aria-label="Onderbouwing">${esc(k.waarom)}</textarea>
    <p style="margin-top:6px"><button type="button" class="terug" id="herstel" style="font-size:13px;padding:0">↺ Voorstel van de app terugzetten</button></p>`;
  $('#k_waarom').oninput=e=>{ k.waarom=e.target.value; bewaar(); };
  $('#herstel').onclick=()=>{ if(confirm('Je eigen aanpassingen aan je keuze en onderbouwing gaan verloren. Doorgaan?')){ st.keuze=standaardKeuze(); bewaar(); render(); } };
  nav(d, true, 'Laatste stap →');
}
function afronden(v, d){
  const k = zorgKeuze();
  d.innerHTML = `<span class="label">Keuze 3 van 3</span><h2>Wat ga je nu doen?</h2>
    <div class="vak" style="margin-top:4px"><label>Mijn volgende stappen</label><div class="checks">${STAPPEN.map((s,i)=>`<label><input type="checkbox" data-i="${i}" ${k.stappen.includes(s)?'checked':''}> ${esc(s)}</label>`).join('')}</div></div>
    <div class="vak"><label for="k_extra">Vraag of opmerking voor mijn SLB'er</label><textarea id="k_extra" style="min-height:64px">${esc(k.extra)}</textarea></div>
    <p class="melding" id="melding"></p>
    <p class="klein">Klik op <b>E-mail opstellen</b>: je mailprogramma opent met alles erin, gericht aan ${MAIL}. Controleer de tekst en druk zelf op Verzenden. Werkt dat niet? Kopieer de tekst en plak hem in een nieuwe mail.</p>`;
  $('#k_extra').oninput=e=>{ k.extra=e.target.value; bewaar(); };
  d.querySelectorAll('.checks input').forEach(c=>c.onchange=()=>{ k.stappen=[...d.querySelectorAll('.checks input:checked')].map(x=>STAPPEN[+x.dataset.i]); bewaar(); });
  const b = nav(d, true, '✉️ E-mail opstellen', '<button class="knop rand" type="button" id="kopie">📋 Kopieer</button>');
  b.classList.add('oranje');
  b.onclick=()=>{
    const onderwerp = `Doorstroomkeuze ${st.naam}${st.klas?' ('+st.klas+')':''}`;
    window.location.href = `mailto:${MAIL}?subject=${encodeURIComponent(onderwerp)}&body=${encodeURIComponent(mailTekst().replace(/\n/g,'\r\n'))}`;
    $('#melding').textContent = 'Je mailprogramma wordt geopend… Niets gezien? Gebruik "Kopieer".';
  };
  $('#kopie').onclick=async()=>{
    const t = mailTekst();
    try{ await navigator.clipboard.writeText(t); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    $('#melding').textContent='Gekopieerd! Plak het in een mail aan '+MAIL+'.';
  };
}
function mailTekst(){
  const k=st.keuze, sc=scores();
  const L=[];
  L.push('Beste SLB-docent,','');
  L.push(`Hierbij mijn doorstroomkeuze uit de SLB-les.`,'');
  L.push('MIJN KEUZE: '+k.opl+(k.anders && KEUZES[1][1].includes(k.opl)?' – '+k.anders:''));
  if(k.route.trim()) L.push('ROUTE: '+k.route.trim());
  L.push('','WAAROM:', k.waarom.trim()||'-');
  if(k.stappen.length){ L.push('','VOLGENDE STAPPEN:'); k.stappen.forEach(s=>L.push('- '+s)); }
  const rf = REFL.filter(r=>(st.refl[r.id]||'').trim());
  if(rf.length){ L.push('','REFLECTIE:'); rf.forEach(r=>{ L.push(r.l, st.refl[r.id].trim(), ''); }); }
  if(k.extra.trim()) L.push('VRAAG/OPMERKING:', k.extra.trim(), '');
  L.push('Uitslag van de app: '+sc.rang.slice(0,3).map(r=>`${TR[r.k].kort} ${r.p}%`).join(', ')+`. ICT leuk: ${st.a.leuk??'-'}/5.`);
  L.push('','Groeten,', st.naam+(st.klas?' ('+st.klas+')':''));
  return L.join('\n');
}

$('#reset').onclick=()=>{ if(confirm('Alles wissen en opnieuw beginnen?')){ try{localStorage.removeItem(OPSLAG);}catch(e){} st={stap:0,naam:'',klas:'',a:{},refl:{},keuze:null}; render(); } };
render();
</script>
</body>
</html>
