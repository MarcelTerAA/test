<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jouw eerste dag in IT · Ter AA ICT</title>
<meta name="description" content="Open-dag-game van Ter AA ICT: speel in 10 minuten de opleiding Medewerker ICT (niveau 2) na.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#031020; --navy2:#0a1c33; --navy3:#12294a;
  --cyan:#55E5E2; --oranje:#FF943F; --wit:#ffffff; --grijs:#a9bdd3; --lime:#C5F76A;
  --rood:#ff6b6b; --groen:#5fe39a;
  --kaart:rgba(255,255,255,.05); --rand:rgba(85,229,226,.25);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--wit);font-family:Outfit,system-ui,Segoe UI,Arial,sans-serif;min-height:100%}
body{min-height:100dvh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(85,229,226,.10),transparent 60%),
  radial-gradient(700px 400px at -10% 110%,rgba(255,148,63,.08),transparent 60%),var(--navy);
  overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.circuit{position:fixed;left:0;right:0;bottom:0;height:140px;pointer-events:none;opacity:.22;z-index:0}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}

/* labels & typografie */
.label{font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.label.or{color:var(--oranje)}
h1,h2,h3{margin:.2em 0 .35em;line-height:1.05;font-weight:800}
h1{font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4.5vw,2.3rem)}
h3{font-size:1.2rem}
.acc{color:var(--oranje)} .acc2{color:var(--cyan)}
p{line-height:1.45;margin:.4em 0}
.zacht{color:var(--grijs)}

/* knoppen */
.knop{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.6em;border-radius:999px;font-weight:800;font-size:1.05rem;background:var(--oranje);color:#1a0d02;box-shadow:0 6px 24px rgba(255,148,63,.35);transition:transform .12s, box-shadow .12s}
.knop:active{transform:scale(.97)}
.knop:hover{box-shadow:0 8px 30px rgba(255,148,63,.5)}
.knop.cyaan{background:transparent;color:var(--cyan);border:2px solid var(--cyan);box-shadow:none}
.knop.klein{padding:.55em 1.1em;font-size:.95rem}
.knop[disabled]{opacity:.35;pointer-events:none}

/* topbalk */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px;flex-wrap:wrap}
.top .logo{height:24px;width:auto}
.top .titel{font-weight:700;font-size:.95rem;color:var(--grijs);flex:1;min-width:120px}
.meters{display:flex;gap:10px}
.meter{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--grijs)}
.meter .bar{width:54px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .6s}
.m-vak i{background:var(--cyan)} .m-klant i{background:var(--oranje)} .m-netjes i{background:var(--lime)}
.ikoon-knop{width:38px;height:38px;border-radius:50%;border:1px solid var(--rand);display:grid;place-items:center;font-size:1.1rem}
@media (max-width:620px){.meter span.t{display:none}.meter .bar{width:38px}.top .titel{display:none}}

/* schermen */
.scherm{flex:1;display:flex;flex-direction:column;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:var(--r);padding:18px}
.midden{text-align:center;align-items:center}

/* start */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:min(78dvh,620px);display:flex;align-items:flex-end;background:var(--navy) center right/cover no-repeat;border:1px solid rgba(85,229,226,.15)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,16,32,.96) 0%,rgba(3,16,32,.75) 45%,rgba(3,16,32,.1) 80%)}
.hero .in{position:relative;padding:32px clamp(20px,5vw,48px);max-width:620px}
.hero .logo{height:38px;width:auto;margin-bottom:18px}
.hero .sub{font-size:1.25rem;font-weight:600;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
.chip{font-size:.8rem;font-weight:700;padding:.35em .8em;border-radius:999px;border:1px solid var(--rand);color:var(--cyan);background:rgba(85,229,226,.06)}
.chip.or{border-color:rgba(255,148,63,.4);color:var(--oranje);background:rgba(255,148,63,.07)}
@media (max-width:620px){.hero{background-position:72% center}.hero::before{background:linear-gradient(0deg,rgba(3,16,32,.98) 30%,rgba(3,16,32,.55) 70%,rgba(3,16,32,.2))}}

/* Noor */
.noor{display:flex;gap:12px;align-items:flex-start;margin:6px 0 14px}
.noor img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);box-shadow:0 0 18px rgba(85,229,226,.4);flex:none}
.noor .bel{background:var(--navy3);border:1px solid var(--rand);border-radius:4px 16px 16px 16px;padding:12px 15px;line-height:1.4;font-size:1.02rem}
.noor .bel b{color:var(--cyan)}

/* naam & avatar */
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.avatars button{font-size:2rem;aspect-ratio:1;border-radius:14px;border:2px solid rgba(255,255,255,.1);background:var(--kaart)}
.avatars button.aan{border-color:var(--oranje);background:rgba(255,148,63,.12)}
input[type=text]{width:100%;font:inherit;font-size:1.15rem;padding:.8em 1em;border-radius:12px;border:2px solid var(--rand);background:var(--navy2);color:var(--wit);outline:none}
input[type=text]:focus{border-color:var(--cyan)}

/* swipe-kaarten */
.swipe{position:relative;height:290px;max-width:420px;margin:10px auto 18px;width:100%}
.swipekaart{position:absolute;inset:0;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,var(--navy3),var(--navy2));border:1px solid var(--rand);box-shadow:0 18px 40px rgba(0,0,0,.4);transition:transform .35s ease, opacity .35s ease;touch-action:pan-y}
.swipekaart .em{font-size:3.6rem;margin-bottom:10px}
.swipekaart .tk{font-size:1.35rem;font-weight:700;line-height:1.25}
.swipekaart.weg-l{transform:translateX(-130%) rotate(-18deg);opacity:0}
.swipekaart.weg-r{transform:translateX(130%) rotate(18deg);opacity:0}
.swipe-knoppen{display:flex;gap:14px;justify-content:center}
.swipe-knoppen .knop{min-width:140px}

/* kaart / route */
.route{display:grid;gap:12px;margin-top:8px}
.stop{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--kaart);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%;position:relative}
.stop .nr{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15)}
.stop .tx{flex:1;min-width:0}
.stop .tx b{display:block;font-size:1.08rem}
.stop .tx small{color:var(--grijs);font-size:.85rem}
.stop .st{font-size:1.1rem;letter-spacing:2px;color:var(--oranje);white-space:nowrap}
.stop.klaar .nr{background:rgba(95,227,154,.15);border-color:var(--groen);color:var(--groen)}
.stop.nu{border-color:var(--oranje);background:rgba(255,148,63,.09);box-shadow:0 0 0 0 rgba(255,148,63,.5);animation:puls 1.8s infinite}
.stop.nu .nr{background:var(--oranje);color:#1a0d02;border-color:var(--oranje)}
.stop.dicht{opacity:.42;pointer-events:none}
.stop.mijl{padding:8px 16px;background:transparent;border-style:dashed;pointer-events:none}
.stop.mijl .nr{width:32px;height:32px;font-size:1rem;margin:0 7px}
.stop.bonus{border-color:rgba(197,247,106,.35)}
.stop.bonus .nr{color:var(--lime);border-color:var(--lime)}
.stop .tag{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--lime);border:1px solid var(--lime);border-radius:99px;padding:.15em .6em;margin-left:6px;vertical-align:middle}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(255,148,63,.45)}70%{box-shadow:0 0 0 12px rgba(255,148,63,0)}100%{box-shadow:0 0 0 0 rgba(255,148,63,0)}}

/* level intro */
.intro-kop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.intro-kop .groot{font-size:3.2rem;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;background:rgba(85,229,226,.08);border:1px solid var(--rand)}
.kd{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.kd span{font-size:.8rem;padding:.35em .75em;border-radius:8px;background:rgba(255,148,63,.1);border:1px solid rgba(255,148,63,.35);color:#ffd2ad}

/* keuzes */
.vraag{font-size:1.2rem;font-weight:700;margin:6px 0 12px;line-height:1.3}
.opties{display:grid;gap:10px}
.optie{text-align:left;padding:14px 16px;border-radius:14px;background:var(--navy2);border:2px solid rgba(255,255,255,.1);font-size:1.02rem;line-height:1.35;transition:border-color .15s, background .15s}
.optie:hover{border-color:rgba(85,229,226,.5)}
.optie.gekozen{border-color:var(--cyan)}
.optie.goed{border-color:var(--groen);background:rgba(95,227,154,.12)}
.optie.fout{border-color:var(--rood);background:rgba(255,107,107,.10)}
.optie.juist{border-color:var(--groen);border-style:dashed}
.opties.op-slot .optie{pointer-events:none}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;display:flex;gap:12px;align-items:flex-start;animation:in .3s}
.fb img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--cyan)}
.fb.goed{background:rgba(95,227,154,.1);border:1px solid rgba(95,227,154,.4)}
.fb.fout{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35)}
.fb .k{font-weight:800;display:block;margin-bottom:2px}
.fb.goed .k{color:var(--groen)} .fb.fout .k{color:var(--rood)}
.verder{margin-top:14px;display:flex;justify-content:flex-end}
.stap{font-size:.8rem;font-weight:700;color:var(--grijs);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.schud{animation:schud .4s}
@keyframes schud{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* pc bouwen */
.bouw{display:grid;grid-template-columns:1fr 210px;gap:16px}
@media (max-width:700px){.bouw{grid-template-columns:1fr}}
.kast{position:relative;aspect-ratio:1/1.05;max-height:440px;width:100%;border-radius:18px;background:linear-gradient(145deg,#0b1626,#060d18);border:2px solid #24364f;padding:16px}
.bord{position:absolute;left:8%;top:6%;width:84%;height:62%;border-radius:10px;background:
  repeating-linear-gradient(90deg,rgba(85,229,226,.07) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(0deg,rgba(85,229,226,.07) 0 1px,transparent 1px 26px),#0f3b37;border:2px solid #1d6a62}
.bord .naam{position:absolute;left:10px;top:6px;font-size:.7rem;letter-spacing:.15em;color:rgba(85,229,226,.6);font-weight:700}
.slot{position:absolute;border:2px dashed rgba(255,255,255,.35);border-radius:8px;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:rgba(255,255,255,.55);text-align:center;transition:all .2s;padding:2px}
.slot.doel{border-color:var(--oranje);color:var(--oranje);background:rgba(255,148,63,.1);animation:puls 1.4s infinite}
.slot.vol{border:2px solid var(--groen);color:#fff;font-size:.78rem}
.s-cpu{left:30%;top:16%;width:26%;height:30%}
.s-ram{left:66%;top:10%;width:20%;height:54%}
.s-ssd{left:22%;top:62%;width:40%;height:15%}
.s-psu{left:8%;top:73%;width:42%;height:21%}
.s-gpu{left:56%;top:73%;width:36%;height:21%}
.slot.vol.s-cpu{background:linear-gradient(135deg,#c9ced6,#8d96a3);color:#111}
.slot.vol.s-ram{background:repeating-linear-gradient(0deg,#1d2a3c 0 6px,#2d3f58 6px 12px);border-color:var(--cyan)}
.slot.vol.s-ssd{background:#222;}
.slot.vol.s-psu{background:radial-gradient(circle at 70% 50%,#333 0 30%,#1a1a1a 31%)}
.slot.vol.s-gpu{background:linear-gradient(90deg,#1b1b1b,#2b2b2b);box-shadow:inset 0 -4px 0 var(--oranje)}
.lade{display:grid;gap:8px;align-content:start}
@media (max-width:700px){.lade{grid-template-columns:repeat(3,1fr)}}
.onderdeel{padding:10px 12px;border-radius:12px;background:var(--navy2);border:2px solid rgba(255,255,255,.12);text-align:left;font-weight:700;display:flex;gap:8px;align-items:center;font-size:.92rem}
.onderdeel small{display:block;font-weight:400;color:var(--grijs);font-size:.75rem}
.onderdeel.sel{border-color:var(--oranje);background:rgba(255,148,63,.12)}
.onderdeel.weg{visibility:hidden}
.onderdeel .ic{font-size:1.4rem}

/* terminal */
.term{font-family:Consolas,Menlo,monospace;background:#000;border:1px solid #1d3550;border-radius:12px;padding:16px;min-height:200px;color:#9fffc8;font-size:.95rem;line-height:1.6;white-space:pre-wrap}
.term .c{color:var(--cyan)}

/* telefoon/chat */
.bellen{max-width:560px;margin:0 auto;width:100%}
.beller{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--navy2);border:1px solid var(--rand);margin-bottom:12px}
.beller .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:rgba(255,148,63,.15);border:2px solid var(--oranje);flex:none}
.beller b{display:block}
.beller small{color:var(--grijs)}
.rinkel{animation:rinkel .5s infinite}
@keyframes rinkel{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.4;animation:in .3s}
.bub.zij{background:#22324a;border-top-left-radius:4px;align-self:flex-start}
.bub.ik{background:rgba(85,229,226,.16);border:1px solid var(--rand);border-top-right-radius:4px;align-self:flex-end}

/* kabel */
.stekker{display:flex;gap:6px;justify-content:center;padding:14px 18px 22px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.25);border-radius:12px 12px 26px 26px;max-width:420px;margin:8px auto 4px}
.pin{width:34px;height:80px;border-radius:6px;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:flex-end;justify-content:center;font-size:.7rem;color:var(--grijs);padding-bottom:3px;position:relative}
.pin.vol{border-style:solid;border-color:rgba(255,255,255,.2)}
.pin .led{position:absolute;top:-16px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#333;transition:background .2s, box-shadow .2s}
.pin .led.aan{background:var(--groen);box-shadow:0 0 10px var(--groen)}
.draden{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.draad{width:64px;height:64px;border-radius:12px;border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px;font-size:.66rem;font-weight:700;background:var(--navy2)}
.draad i{display:block;width:16px;height:38px;border-radius:5px;margin-bottom:4px}
.draad.weg{visibility:hidden}
.schema{font-size:.85rem;color:var(--grijs);text-align:center;margin:4px 0 0}
.schema .rij{display:flex;gap:4px;justify-content:center;margin-top:6px}
.schema .rij i{width:22px;height:10px;border-radius:3px;display:block}

/* tickets */
.desk{display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:700px){.desk{grid-template-columns:1fr}.desk .wachtrij{display:flex;overflow-x:auto;gap:6px}.desk .wachtrij .tk{min-width:130px;white-space:nowrap}}
.wachtrij{display:grid;gap:6px;align-content:start}
.wachtrij .tk{padding:8px 10px;border-radius:10px;background:var(--navy2);border:1px solid rgba(255,255,255,.08);font-size:.8rem;color:var(--grijs)}
.wachtrij .tk.nu{border-color:var(--oranje);color:#fff}
.wachtrij .tk.af{opacity:.5;text-decoration:line-through}
.ticket{background:#f4f7fb;color:#13223a;border-radius:14px;padding:16px;border-top:6px solid var(--cyan)}
.ticket .kop{display:flex;justify-content:space-between;font-size:.8rem;color:#5a6b85;font-weight:700;letter-spacing:.05em}
.ticket h3{color:#0b1a30;margin:.3em 0}
.ticket p{color:#2b3b55}
.prio{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.prio button{flex:1;min-width:90px;padding:.7em;border-radius:10px;font-weight:800;border:2px solid #c9d3e2;background:#fff;color:#13223a}
.prio button.p-h{border-color:#ff6b6b} .prio button.p-n{border-color:#ffb067} .prio button.p-l{border-color:#7bd6a3}
.prio button.goed{background:#d9f7e6} .prio button.fout{background:#ffe0e0}
.ticket .optie{background:#fff;color:#13223a;border-color:#d4dceb}
.ticket .optie.goed{background:#d9f7e6;border-color:#2fbf71}
.ticket .optie.fout{background:#ffe0e0;border-color:#e05555}
.ticket .optie.juist{border-color:#2fbf71}
.klok{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 12px}
.klok i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--oranje));transition:width 1s linear}
.mini-fb{font-size:.9rem;margin-top:8px;font-weight:700}
.mini-fb.goed{color:#1d9e5a} .mini-fb.fout{color:#c43d3d}

/* klant-o-meter */
.kom{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.kom .gezicht{font-size:2.4rem;transition:transform .3s}
.kom .bar{flex:1;height:14px;border-radius:9px;background:linear-gradient(90deg,#ff6b6b,#ffb067 50%,#5fe39a);position:relative}
.kom .bar i{position:absolute;top:-6px;width:6px;height:26px;border-radius:4px;background:#fff;box-shadow:0 0 8px #fff;transition:left .6s;margin-left:-3px}

/* bpv klok */
.dagklok{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem;color:var(--cyan);margin-bottom:6px}
.dagklok .uur{font-family:Consolas,monospace;background:#000;border:1px solid var(--rand);border-radius:8px;padding:.1em .5em}

/* pi */
.code{background:#0b1626;border:1px solid var(--rand);border-radius:14px;padding:16px;font-size:1.1rem;font-weight:700;line-height:2.4}
.blok{display:inline-block;padding:.15em .7em;border-radius:8px;margin:0 2px}
.blok.als{background:#ffb067;color:#2a1400}
.blok.dan{background:var(--cyan);color:#002b2a}
.blok.kies{background:#fff;color:#13223a;border:2px solid var(--oranje);cursor:pointer;min-width:60px;text-align:center}
.blok.kies::after{content:" ▾";font-size:.8em;opacity:.6}
.kas{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:16px}
.fan{width:90px;height:90px;border-radius:50%;border:4px solid #2a3e5a;display:grid;place-items:center;font-size:3rem;background:#0b1626}
.fan.draait span{animation:draai .5s linear infinite;display:inline-block}
@keyframes draai{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--oranje)}
.temp{font-size:1.8rem;font-weight:800}

/* resultaat */
.sterren{font-size:3rem;letter-spacing:8px;margin:6px 0}
.sterren span{display:inline-block;opacity:.2;transform:scale(.6);transition:all .4s}
.sterren span.aan{opacity:1;transform:scale(1);color:var(--oranje);text-shadow:0 0 18px rgba(255,148,63,.7)}
.echt{display:flex;gap:12px;text-align:left;margin:16px 0;padding:16px;border-radius:14px;background:rgba(85,229,226,.07);border:1px solid var(--rand)}
.echt .em{font-size:1.8rem}

/* diploma */
.diploma{position:relative;background:linear-gradient(160deg,#0f2440,#071427);border:2px solid var(--oranje);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 0 50px rgba(255,148,63,.2);overflow:hidden}
.diploma::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,148,63,.3);border-radius:16px;pointer-events:none}
.diploma .logo{height:32px;margin:0 auto 10px}
.diploma .naam{font-size:2.2rem;font-weight:800;color:var(--oranje);margin:4px 0}
.diploma .kt{display:grid;gap:6px;text-align:left;max-width:520px;margin:14px auto;font-size:.92rem}
.diploma .kt div{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.diploma .kt div::before{content:"✔ ";color:var(--groen);font-weight:800}
.eindmeters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.eindmeters .em{padding:12px;border-radius:12px;background:var(--kaart);border:1px solid rgba(255,255,255,.08)}
.eindmeters b{display:block;font-size:1.6rem}
.type{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left}
.type .em{font-size:3.5rem}
.tijdlijn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
@media (max-width:620px){.tijdlijn{grid-template-columns:1fr 1fr}}
.tijdlijn div{padding:10px;border-radius:10px;background:var(--kaart);border-top:3px solid var(--cyan);font-size:.85rem}
.tijdlijn div b{display:block;font-size:.95rem;color:var(--cyan)}
.tijdlijn div:nth-child(3){border-color:var(--oranje)} .tijdlijn div:nth-child(3) b{color:var(--oranje)}
.tijdlijn div:nth-child(4){border-color:var(--lime)} .tijdlijn div:nth-child(4) b{color:var(--lime)}

/* idle */
.overlay{position:fixed;inset:0;background:rgba(3,16,32,.88);display:grid;place-items:center;z-index:50;padding:20px;animation:in .3s}
.overlay .kaart{max-width:420px;text-align:center;background:var(--navy2)}
.teller{font-size:3.5rem;font-weight:800;color:var(--oranje)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:val linear forwards}
@keyframes val{to{transform:translateY(110vh) rotate(720deg)}}
.rij{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ruimte{flex:1}
</style>

/* ================= status ================= */
let S;
function nieuw(){
  S = {naam:'', av:'🦊', profiel:{sleutelaar:0,helper:0,netwerker:0,maker:0},
       meter:{vak:[0,0],klant:[0,0],netjes:[0,0]}, sterren:{}, klaar:[], lvl:null};
}
nieuw();
let L = {got:0,max:0};               // score huidige level
function punt(m, waarde, gewicht=1){ S.meter[m][0]+=waarde*gewicht; S.meter[m][1]+=gewicht; L.got+=waarde*gewicht; L.max+=gewicht; tekenMeters(); }
function pct(m){ const [a,b]=S.meter[m]; return b? Math.round(a/b*100):0; }

/* ================= geluid ================= */
let stil=false; try{stil=localStorage.getItem('eerstedag_stil')==='1'}catch(e){}
let AC=null;
function toon(f,t0,d,type='sine',vol=.12){ if(stil) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(vol,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d); o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05);}catch(e){} }
const snd={goed(){toon(660,0,.12);toon(990,.1,.18)}, fout(){toon(200,0,.25,'square',.06)}, klik(){toon(520,0,.05,'triangle',.08)}, win(){[523,659,784,1047].forEach((f,i)=>toon(f,i*.12,.25))}};

/* ================= helpers ================= */
const app=document.getElementById('app');
const wacht=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function schud(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function noor(tekst){ return `<div class="noor"><img src="${IMG.kop}" alt="${ROBOT}"><div class="bel"><b>${ROBOT}:</b> ${tekst}</div></div>`; }
function topbalk(titel){
  return `<div class="top"><img class="logo" src="${IMG.logo}" alt="ter AA">
   <div class="titel">${titel||''}</div>
   <div class="meters">
     <div class="meter m-vak" title="Vakkundig"><span>🔧</span><span class="t">Vakkundig</span><div class="bar"><i></i></div></div>
     <div class="meter m-klant" title="Klant blij"><span>😊</span><span class="t">Klant blij</span><div class="bar"><i></i></div></div>
     <div class="meter m-netjes" title="Netjes & veilig"><span>📋</span><span class="t">Netjes</span><div class="bar"><i></i></div></div>
   </div>
   <button class="ikoon-knop" id="geluid" title="Geluid aan/uit">${stil?'🔇':'🔊'}</button></div>`;
}
function tekenMeters(){
  [['vak','m-vak'],['klant','m-klant'],['netjes','m-netjes']].forEach(([m,c])=>{ const el=document.querySelector('.'+c+' .bar i'); if(el) el.style.width=pct(m)+'%'; });
}
function scherm(html,titel,metTop=true){
  app.innerHTML=(metTop?topbalk(titel):'')+`<div class="scherm">${html}</div>`;
  const g=document.getElementById('geluid');
  if(g) g.onclick=()=>{stil=!stil; try{localStorage.setItem('eerstedag_stil',stil?'1':'0')}catch(e){} g.textContent=stil?'🔇':'🔊';};
  tekenMeters(); window.scrollTo({top:0,behavior:'smooth'});
  return app.querySelector('.scherm');
}
function confetti(n=70){
  const c=document.createElement('div'); c.className='confetti';
  const kl=['#FF943F','#55E5E2','#C5F76A','#ffffff'];
  for(let i=0;i<n;i++){const e=document.createElement('i'); e.style.left=Math.random()*100+'%'; e.style.background=kl[i%4]; e.style.animationDuration=(1.6+Math.random()*1.8)+'s'; e.style.animationDelay=(Math.random()*.6)+'s'; c.appendChild(e);}
  document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
}

/* Meerkeuzevraag. opties: [{t, ok(bool of 0..1), fb}] */
function kies(el,{stap='',vraag,opties,meter='vak',gewicht=1,husselen=true,voor=''}){
  return new Promise(res=>{
    const lijst=husselen?schud(opties):opties;
    el.innerHTML=`${voor}${stap?`<div class="stap">${stap}</div>`:''}<div class="vraag">${vraag}</div>
      <div class="opties">${lijst.map((o,i)=>`<button class="optie" data-i="${i}">${o.t}</button>`).join('')}</div><div class="na"></div>`;
    el.querySelectorAll('.optie').forEach(b=>b.onclick=()=>{
      const o=lijst[+b.dataset.i]; const w=o.ok===true?1:(o.ok===false?0:o.ok);
      el.querySelector('.opties').classList.add('op-slot');
      b.classList.add(w>=1?'goed':'fout');
      if(w<1){ const beste=lijst.reduce((m,x,i)=>((x.ok===true?1:+x.ok||0)>(lijst[m].ok===true?1:+lijst[m].ok||0)?i:m),0); el.querySelectorAll('.optie')[beste].classList.add('juist'); }
      (w>=1?snd.goed:snd.fout)();
      punt(meter,w,gewicht);
      el.querySelector('.na').innerHTML=`<div class="fb ${w>=1?'goed':'fout'}"><img src="${IMG.kop}" alt=""><div><span class="k">${w>=1?'Goed zo!':(w>0?'Bijna!':'Hmm, niet handig…')}</span>${o.fb||''}</div></div>
        <div class="verder"><button class="knop klein">Verder ▸</button></div>`;
      el.querySelector('.verder .knop').onclick=()=>{snd.klik();res(w)};
      el.querySelector('.na').scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });
}

/* Meerdere kiezen. opties: [{t, ok:bool}], aantal = hoeveel goede */
function kiesMeer(el,{stap='',vraag,opties,meter='vak',fbGoed,fbFout,voor=''}){
  return new Promise(res=>{
    const lijst=schud(opties); const nodig=lijst.filter(o=>o.ok).length; const sel=new Set();
    el.innerHTML=`${voor}${stap?`<div class="stap">${stap}</div>`:''}<div class="vraag">${vraag} <span class="zacht">(kies er ${nodig})</span></div>
      <div class="opties" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${lijst.map((o,i)=>`<button class="optie" data-i="${i}">${o.t}</button>`).join('')}</div>
      <div class="verder"><button class="knop klein" id="check" disabled>Klaar ✓</button></div><div class="na"></div>`;
    const knop=el.querySelector('#check');
    el.querySelectorAll('.optie').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; if(sel.has(i)){sel.delete(i);b.classList.remove('gekozen')} else if(sel.size<nodig){sel.add(i);b.classList.add('gekozen')}
      snd.klik(); knop.disabled=sel.size!==nodig;
    });
    knop.onclick=()=>{
      el.querySelector('.opties').classList.add('op-slot'); knop.parentElement.remove();
      let goed=0;
      el.querySelectorAll('.optie').forEach((b,i)=>{ const o=lijst[i]; if(sel.has(i)){ b.classList.add(o.ok?'goed':'fout'); if(o.ok)goed++; } else if(o.ok) b.classList.add('juist'); });
      const w=goed/nodig; punt(meter,w,nodig>2?2:1); (w>=1?snd.goed:snd.fout)();
      const fouten=lijst.filter((o,i)=>sel.has(i)&&!o.ok).map(o=>o.fb).filter(Boolean);
      el.querySelector('.na').innerHTML=`<div class="fb ${w>=1?'goed':'fout'}"><img src="${IMG.kop}" alt=""><div><span class="k">${w>=1?'Helemaal goed!':`${goed} van de ${nodig} goed`}</span>${w>=1?fbGoed:(fouten.join(' ')+' '+(fbFout||''))}</div></div>
        <div class="verder"><button class="knop klein">Verder ▸</button></div>`;
      el.querySelector('.na .knop').onclick=()=>{snd.klik();res(w)};
    };
  });
}

function kabel(st){
  return new Promise(res=>{
    const volg=[ ['wit-oranje','#fff','#ff8a2a'],['oranje','#ff8a2a'],['wit-groen','#fff','#2fbf71'],['blauw','#2f7cf6'],['wit-blauw','#fff','#2f7cf6'],['groen','#2fbf71'],['wit-bruin','#fff','#8b5a2b'],['bruin','#8b5a2b'] ];
    const kleur=d=>d[2]?`repeating-linear-gradient(160deg,${d[1]} 0 5px,${d[2]} 5px 10px)`:d[1];
    let pos=0,fouten=0;
    st.innerHTML=`<div class="stap">Bonusklus · UTP-kabel maken</div>
      ${noor('Het buurtcentrum heeft een nieuwe netwerkkabel nodig. Zet de 8 draadjes in de goede volgorde in de RJ45-stekker. Gebruik het schema!')}
      <div class="schema"><b>Schema T568B</b> (links → rechts)<div class="rij">${volg.map(d=>`<i style="background:${kleur(d)}"></i>`).join('')}</div></div>
      <div class="stekker">${volg.map((d,i)=>`<div class="pin" data-p="${i}"><span class="led"></span>${i+1}</div>`).join('')}</div>
      <div class="draden">${schud(volg.map((d,i)=>i)).map(i=>`<button class="draad" data-i="${i}"><i style="background:${kleur(volg[i])}"></i>${volg[i][0]}</button>`).join('')}</div>
      <div class="na"></div>`;
    const pins=st.querySelectorAll('.pin');
    st.querySelectorAll('.draad').forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.i;
      if(i===pos){ pins[pos].classList.add('vol'); pins[pos].style.background=kleur(volg[i]); pins[pos].style.color='transparent'; b.classList.add('weg'); pos++; snd.klik();
        if(pos===8){
          st.querySelector('.draden').remove();
          st.querySelector('.na').innerHTML='<p class="zacht" style="text-align:center">Krimptang erop… klik! Nu testen met de kabeltester:</p>';
          await wacht(500);
          for(let j=0;j<8;j++){ pins[j].querySelector('.led').classList.add('aan'); toon(500+j*60,0,.08); await wacht(180); }
          punt('vak',Math.max(0,1-fouten*.15),2); snd.win();
          st.querySelector('.na').innerHTML=`<div class="fb goed"><img src="${IMG.kop}" alt=""><div><span class="k">Alle 8 lampjes groen!</span>De kabel werkt. ${fouten?`(${fouten} keer bijgestuurd)`:'In één keer goed!'} Op school maak je ze echt, met een krimptang.</div></div>`;
          knopWacht(st.querySelector('.na')).then(res);
        }
      } else { fouten++; snd.fout(); b.classList.add('schud'); setTimeout(()=>b.classList.remove('schud'),400); }
    });
  });
}

      if(klaar) return; klaar=true; clearInterval(timer);
      for(let i=n;i<T.length;i++){ punt('klant',0); }

        if(klaar) return;
        const ok=b.dataset.p===x.p; st.querySelectorAll('.prio button').forEach(z=>{z.disabled=true; if(z.dataset.p===x.p)z.classList.add('goed')}); if(!ok)b.classList.add('fout');
        punt('klant',ok?1:(Math.abs('hnl'.indexOf(b.dataset.p)-'hnl'.indexOf(x.p))===1?.4:0)); (ok?snd.goed:snd.fout)();
        st.querySelector('#f1').className='mini-fb '+(ok?'goed':'fout'); st.querySelector('#f1').textContent=ok?'✓ Juiste prioriteit':'✗ Dat had '+{h:'Hoog',n:'Normaal',l:'Laag'}[x.p]+' moeten zijn';
        st.querySelector('#stap2').innerHTML=`<div class="stap" style="color:#5a6b85;margin-top:10px">2 · Oplossing</div><div class="opties">${acties.map((a,i)=>`<button class="optie" data-i="${i}">${a.t}</button>`).join('')}</div><div class="mini-fb" id="f2"></div>`;
        st.querySelectorAll('#stap2 .optie').forEach(o=>o.onclick=()=>{
          if(klaar) return;
          const a=acties[+o.dataset.i]; st.querySelector('#stap2 .opties').classList.add('op-slot'); o.classList.add(a.ok?'goed':'fout');
          if(!a.ok) st.querySelectorAll('#stap2 .optie')[acties.findIndex(z=>z.ok)].classList.add('juist');
          punt(x.meter||'vak',a.ok?1:0); (a.ok?snd.goed:snd.fout)();
          st.querySelector('#f2').className='mini-fb '+(a.ok?'goed':'fout'); st.querySelector('#f2').textContent=a.ok?'✓ Opgelost en geregistreerd':'✗ Niet de beste keuze, kijk naar het groene antwoord';
          n++; setTimeout(toonTicket,a.ok?900:1800);
        });
      });
    }
    toonTicket();
  });
}

    {klant:'Hij doet het weer! Maar eigenlijk wil ik gewoon een <b>nieuwe laptop</b>, deze is oud. Regel jij dat even?',
     opties:[{t:'"Dat mag ik niet zelf beslissen. Ik leg uw vraag voor aan mijn leidinggevende en bel u vóór 15:00 terug."',d:25,fb:'Perfect! Je weet wat je wel en niet mag, je <b>stemt af met je leidinggevende</b> en maakt een duidelijke afspraak.',meter:'netjes'},
             {t:'"Tuurlijk! Ik bestel er vandaag één voor u."',d:-5,fb:'Lief, maar dat mag je niet zelf beslissen. Beloof nooit iets wat je niet kunt waarmaken.',meter:'netjes'},
             {t:'"Nee, dat gaat niet gebeuren."',d:-15,fb:'Te bot. Misschien heeft hij wel gelijk; laat het iemand beslissen die dat mag.',meter:'netjes'}]},
  ];
  const kop=()=>`<div class="beller"><div class="av">${blij<35?'😡':blij<60?'😐':blij<85?'🙂':'😄'}</div><div><b>Meneer De Vries</b><small>Klant · advocatenkantoor</small></div></div>
    <div class="kom"><span class="zacht" style="font-size:.85rem">Klant-o-meter</span><div class="bar"><i style="left:${blij}%"></i></div></div>`;
  for(let i=0;i<beurten.length;i++){
    const b=beurten[i];
    const voor=`<div class="bellen">${kop()}<div class="chat"><div class="bub zij">${b.klant}</div></div></div>`;
    await new Promise(res=>{
      const lijst=schud(b.opties);
      st.innerHTML=`${i===0?noor('Blijf rustig, ook als de klant boos is. Kijk naar de <b>klant-o-meter</b>!'):''}${voor}<div class="stap">Beurt ${i+1} van 4</div><div class="opties">${lijst.map((o,j)=>`<button class="optie" data-j="${j}">${o.t}</button>`).join('')}</div><div class="na"></div>`;
      st.querySelectorAll('.optie').forEach(o=>o.onclick=()=>{
        const c=lijst[+o.dataset.j]; const best=Math.max(...b.opties.map(x=>x.d));
        st.querySelector('.opties').classList.add('op-slot'); o.classList.add(c.d===best?'goed':'fout');
        if(c.d!==best) st.querySelectorAll('.optie')[lijst.findIndex(x=>x.d===best)].classList.add('juist');
        blij=Math.max(0,Math.min(100,blij+c.d)); punt(c.meter||'klant',c.d===best?1:(c.d>=0?.4:0));
        (c.d===best?snd.goed:snd.fout)();
        st.querySelector('.kom .bar i').style.left=blij+'%';
        st.querySelector('.beller .av').textContent=blij<35?'😡':blij<60?'😐':blij<85?'🙂':'😄';
        st.querySelector('.na').innerHTML=`<div class="fb ${c.d===best?'goed':'fout'}"><img src="${IMG.kop}" alt=""><div><span class="k">${c.d>0?'+':''}${c.d} klant-o-meter</span>${c.fb}</div></div>`;
        knopWacht(st.querySelector('.na')).then(res);
      });
    });
  }
  st.innerHTML=`<div class="bellen">${kop()}<div class="chat"><div class="bub zij">${blij>=70?'Dankjewel, echt top geholpen! Ik ga mijn presentatie geven.':blij>=40?'Oké, het werkt weer. Bedankt.':'Hmpf. Het werkt, maar ik ben er niet blij mee.'}</div></div>
    <div class="fb goed"><img src="${IMG.kop}" alt=""><div><span class="k">Ticket afgesloten ✓</span>Klant-o-meter eindstand: <b>${blij}%</b>. In de opleiding oefen je dit met rollenspellen en echte servicedeskdagen.</div></div></div>`;
  await knopWacht(st);
}

/* ================= IDLE / KIOSK ================= */
let laatste=Date.now(), overlay=null;
['pointerdown','click','keydown','touchstart','input'].forEach(e=>document.addEventListener(e,()=>{laatste=Date.now()},{passive:true}));
setInterval(()=>{
  if(overlay || !app.querySelector('.top')) return; // niet op het startscherm
  if(Date.now()-laatste>IDLE_SEC*1000){
    let n=IDLE_TELLER;
    overlay=document.createElement('div'); overlay.className='overlay';
    overlay.innerHTML=`<div class="kaart"><img src="${IMG.robot}" alt="" style="border-radius:12px;margin-bottom:10px"><h3>Ben je er nog?</h3><p class="zacht">Anders begint de game opnieuw voor de volgende bezoeker.</p><div class="teller">${n}</div><button class="knop">Ik ben er nog!</button></div>`;
    document.body.appendChild(overlay);
    const t=setInterval(()=>{ n--; overlay.querySelector('.teller').textContent=n; if(n<=0){clearInterval(t);overlay.remove();overlay=null;startScherm();} },1000);
    overlay.querySelector('.knop').onclick=()=>{clearInterval(t);overlay.remove();overlay=null;laatste=Date.now();};
  }
},2000);

startScherm();
</script>
