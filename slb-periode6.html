<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLB periode 6 · Van student naar ICT-professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ter AA huisstijl */
  --basis:#EFA242;
  --oranje:#FF5900; --groen:#90F87B; --paars:#9447F0; --geel:#FADE29;
  --l-geel:#FFE398; --l-zalm:#F8CBAF; --l-mint:#A6EBC7; --l-lila:#E5C7FE; --l-blauw:#B2C6D3;
  --m-zalm:#FF996E; --m-groen:#26C373; --m-lila:#D594FF; --m-blauw:#6698AD;
  --d-oker:#CD963C; --d-oranje:#D2652A; --d-groen:#3D6B52; --d-paars:#5A4494; --d-grijs:#53666B;
  --tekst:#1E2426; --zacht:#53666B; --lijn:#E4E1DA; --bg:#FFFFFF; --vlak:#FBF8F2;
  --accent:var(--basis); --accent-l:var(--l-geel); --accent-d:var(--d-oker);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font-family:Poppins,Arial,sans-serif;color:var(--tekst);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:0 16px 80px;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;gap:12px}
.logo{color:var(--basis);height:34px;display:block}
.logo svg{height:100%;width:auto;display:block}
.top-r{font-size:13px;color:var(--zacht);text-align:right}
.voortgang{height:8px;background:var(--vlak);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.voortgang i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease,background .3s}
.deelbalk{display:flex;gap:6px;font-size:12px;color:var(--zacht);margin-bottom:18px;flex-wrap:wrap}
.deelbalk span{padding:2px 10px;border-radius:99px;background:var(--vlak)}
.deelbalk span.nu{background:var(--accent-l);color:var(--tekst);font-weight:600}
.deelbalk span.klaar{opacity:.55}

.scherm{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);margin-bottom:6px}
h1{font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em}
h2{font-weight:600;font-size:clamp(21px,4.4vw,27px);line-height:1.25;margin:0 0 10px}
h3{font-weight:600;font-size:17px;margin:0 0 6px}
p{margin:0 0 12px}
.hint{color:var(--zacht);font-size:14px}
.kaart{background:#fff;border:1.5px solid var(--lijn);border-radius:18px;padding:20px}

/* hero */
.hero{position:relative;background:var(--l-geel);border-radius:24px;padding:34px 26px 28px;overflow:hidden;margin-bottom:20px}
.hero .grootA{position:absolute;right:-30px;bottom:-26px;width:250px;color:var(--basis);opacity:.9;pointer-events:none}
.hero .grootA svg{width:100%;height:auto;display:block}
.hero > *:not(.grootA){position:relative;z-index:1;max-width:470px}
.hero p{font-size:16px}
.stappen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stap{background:var(--vlak);border-radius:14px;padding:12px 14px;font-size:14px}
.stap b{display:block;font-size:13px;color:var(--d-oker)}
.velden{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:16px 0}
@media (max-width:520px){.velden{grid-template-columns:1fr}.hero .grootA{width:170px;opacity:.55}}
label.veld{display:block;font-size:13px;font-weight:500}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--lijn);border-radius:12px;padding:11px 13px;background:#fff;margin-top:4px;outline:none;transition:border-color .2s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical;line-height:1.5}

/* knoppen */
.knop{border:0;border-radius:99px;padding:13px 24px;font-weight:600;cursor:pointer;background:var(--tekst);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,opacity .2s;text-decoration:none}
.knop:hover{transform:translateY(-1px)}
.knop:disabled{opacity:.35;cursor:not-allowed;transform:none}
.knop.oranje{background:var(--oranje);color:#fff}
.knop.licht{background:var(--vlak);color:var(--tekst)}
.knop.rand{background:#fff;border:1.5px solid var(--lijn);color:var(--tekst)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.terug{background:none;border:0;cursor:pointer;color:var(--zacht);padding:8px 4px;font-size:15px}
.terug:hover{color:var(--tekst)}

/* opties */
.opties{display:grid;gap:10px;margin-top:16px}
.optie{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--lijn);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.optie:hover{border-color:var(--accent)}
.optie.aan{border-color:var(--accent);background:var(--accent-l)}
.optie .ico{font-size:26px;width:36px;text-align:center;flex:none}
.optie .tx b{display:block;font-weight:600}
.optie .tx small{color:var(--zacht);font-size:13.5px}
.optie .vink{margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--lijn);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.optie.aan .vink{background:var(--tekst);border-color:var(--tekst)}
.opties.twee{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opties.twee{grid-template-columns:1fr}}

.emoji{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.emoji button{border:2px solid var(--lijn);background:#fff;border-radius:16px;padding:14px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--zacht);transition:.15s}
.emoji button span{font-size:clamp(28px,7vw,40px);line-height:1;filter:grayscale(.3)}
.emoji button:hover{border-color:var(--accent)}
.emoji button.aan{border-color:var(--accent);background:var(--accent-l);color:var(--tekst);font-weight:600}
.emoji button.aan span{filter:none;transform:scale(1.12)}

/* stelling */
.stelling{background:var(--accent-l);border-radius:22px;padding:28px 24px;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.stelling .nr{font-size:12px;font-weight:600;color:var(--accent-d);letter-spacing:.05em;text-transform:uppercase}
.stelling h2{margin:6px 0 0;max-width:600px}
.schaal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.schaal button{border:2px solid var(--lijn);background:#fff;border-radius:14px;padding:14px 6px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.25;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.schaal button i{font-style:normal;font-size:22px}
.schaal button:hover{border-color:var(--accent)}
.schaal button.aan{background:var(--tekst);color:#fff;border-color:var(--tekst)}
@media (max-width:480px){.schaal{grid-template-columns:1fr 1fr}}

/* tussenscherm */
.tussen{border-radius:24px;padding:36px 26px;position:relative;overflow:hidden;background:var(--accent-l)}
.tussen .grootA{position:absolute;right:-20px;top:-10px;width:200px;color:var(--accent);opacity:.5}
.tussen .grootA svg{width:100%;height:auto}
.tussen > *:not(.grootA){position:relative}
.tussen .deelnr{font-size:64px;font-weight:700;line-height:1;color:var(--accent-d)}

/* uitslag */
.balken{display:grid;gap:10px;margin:16px 0 8px}
.balk{display:grid;grid-template-columns:minmax(120px,190px) 1fr 46px;align-items:center;gap:10px;font-size:14px}
.balk .bk{height:16px;background:var(--vlak);border-radius:99px;overflow:hidden}
.balk .bk i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.balk b{text-align:right;font-weight:600}
@media (max-width:480px){.balk{grid-template-columns:1fr 46px}.balk .bk{grid-column:1/-1;grid-row:2}}
.top1{border-radius:22px;padding:24px;position:relative;overflow:hidden;margin:18px 0}
.top1 .grootA{position:absolute;right:-24px;bottom:-30px;width:180px;opacity:.35}
.top1 .grootA svg{width:100%;height:auto}
.top1 > *:not(.grootA){position:relative}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:99px;background:#fff;margin:0 6px 6px 0}
.top1 ul{margin:8px 0 12px;padding-left:20px}
.top1 li{margin-bottom:3px}
.redenen{background:var(--vlak);border-radius:16px;padding:16px 18px;margin:14px 0}
.redenen ul{margin:6px 0 0;padding-left:20px}
.route{border-left:5px solid var(--accent);background:#fff;padding:12px 16px;border-radius:0 14px 14px 0;margin:14px 0;box-shadow:0 0 0 1.5px var(--lijn) inset}
.link{color:var(--tekst);font-weight:600;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.andere{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:560px){.andere{grid-template-columns:1fr}}
.andere .kaart{padding:14px 16px}
.andere .kaart b{display:block}
.andere .kaart small{color:var(--zacht)}

/* eindscherm */
.eind{background:var(--tekst);color:#fff;border-radius:24px;padding:26px 24px;position:relative;overflow:hidden}
.eind .grootA{position:absolute;right:-30px;top:-20px;width:220px;color:var(--basis);opacity:.25}
.eind .grootA svg{width:100%;height:auto}
.eind > *:not(.grootA){position:relative}
.eind .label{color:var(--l-geel)}
.eind h2{color:#fff}
.vak{margin:16px 0}
.vak > label{font-weight:600;font-size:14.5px;display:block}
.vak .hint{margin:2px 0 4px;font-size:13px}
.checks{display:grid;gap:6px;margin-top:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer;padding:6px 2px}
.checks input{width:19px;height:19px;accent-color:var(--oranje);margin-top:3px;flex:none}
.acties{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.melding{font-size:14px;color:var(--d-groen);margin-top:10px;min-height:20px}
.klein{font-size:13px;color:var(--zacht)}
footer{margin-top:40px;font-size:12.5px;color:var(--zacht);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--zacht);cursor:pointer;text-decoration:underline;padding:0;font-size:12.5px}

/* ===== Geen-scroll layout: alles past in het scherm, navigatie altijd zichtbaar ===== */
html,body{height:100%}
body{min-height:0;overflow:hidden}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 16px;max-width:820px}
header.top{padding:10px 0 4px;flex:none}
.logo{height:28px}
.top-r{display:flex;align-items:center;gap:14px}
.top-r button{background:none;border:0;color:var(--zacht);cursor:pointer;text-decoration:underline;padding:0;font-size:12.5px}
.voortgang{flex:none;margin:4px 0 4px}
.deelbalk{flex:none;margin-bottom:10px}
main#scherm{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 2px 8px;display:flex;flex-direction:column}
main#scherm > .scherm{margin:auto 0}
#navbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 14px;border-top:1.5px solid var(--lijn)}
#navbar .rechts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#navbar .knop{padding:12px 22px}
h1{font-size:clamp(26px,5vw,38px);margin-bottom:10px}
h2{font-size:clamp(19px,3.6vw,24px);margin-bottom:6px}
p{margin-bottom:8px}
.hero{padding:22px 24px 18px;margin-bottom:12px}
.hero .grootA{width:190px;bottom:-22px}
.stappen{margin:10px 0;gap:8px}
.stap{padding:9px 12px;font-size:13px}
.velden{margin:10px 0 0}
.opties{gap:8px;margin-top:12px}
.optie{padding:10px 14px;gap:12px;border-radius:14px}
.optie .ico{font-size:22px;width:30px}
.optie .tx small{font-size:13px;line-height:1.35;display:block}
@media (min-width:700px){.opties.veel{grid-template-columns:1fr 1fr}}
.emoji{margin-top:14px}
.stelling{padding:22px 22px;min-height:120px}
.schaal{margin-top:12px}
.schaal button{padding:12px 6px}
.tussen{padding:28px 24px}
.tussen .deelnr{font-size:54px}
.balken{gap:8px;margin:10px 0 6px}
.top1{padding:20px 22px;margin:4px 0 0}
.top1 ul{margin:4px 0 8px}
.kolommen{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
@media (max-width:620px){.kolommen{grid-template-columns:1fr}}
.redenen{margin:10px 0 0;padding:14px 18px}
.route{margin:6px 0 0}
.nr2{display:flex;gap:14px;align-items:center;border-radius:16px;padding:12px 16px;margin-top:12px}
.nr2 b{display:block}
.eind{padding:16px 20px;border-radius:18px}
.eind .grootA{width:140px;top:-14px}
.vak{margin:10px 0}
.checks{gap:2px}
.checks label{padding:4px 2px}
textarea{min-height:80px}
textarea.groot{min-height:170px;height:30vh}
.melding{margin-top:6px;min-height:0}
.melding:empty{display:none}
@media (max-height:700px){.stappen{display:none}.hero p{font-size:15px}}
@media (max-width:520px){.top-r #wie{display:none}}
@media (min-width:621px){.checks{grid-template-columns:1fr 1fr}}
.eind{padding:12px 18px}
.top1{padding:16px 20px}
.top1 li{margin-bottom:1px}
.top1 p{margin-bottom:6px}
/* compacte modus voor lage schermen (kleine laptops, ingezoomd) */
@media (max-height:640px){
  header.top{padding:6px 0 2px}.logo{height:24px}
  .deelbalk{display:none!important}.voortgang{margin:2px 0 8px;height:6px}
  h1{font-size:clamp(24px,4vw,30px);margin-bottom:6px}
  h2{font-size:clamp(18px,3vw,21px)}
  .label{margin-bottom:2px}
  .hint{font-size:13px}
  .optie{padding:7px 12px}.opties{gap:6px;margin-top:8px}
  .balken{gap:5px;margin:6px 0 4px}.balk .bk{height:13px}
  .redenen{padding:10px 16px;margin-top:8px}.redenen ul{margin-top:2px}
  .top1{padding:12px 18px}.top1 .chip{margin-bottom:2px}
  .kolommen p,.top1 p{margin-bottom:4px;font-size:15px}.top1 li{font-size:15px}
  .checks label{padding:2px}.vak{margin:6px 0}
  #navbar{padding:7px 0 9px}#navbar .knop{padding:10px 20px}
  .stelling{min-height:100px;padding:18px 20px}
  .hero{padding:16px 22px 14px}
}
/* telefoon: compacte keuzetegels */
@media (max-width:560px){
  .deelbalk{display:none!important}.voortgang{margin:2px 0 10px}
  h2{font-size:19px}
  .optie{position:relative;padding:8px 12px;gap:10px}
  .optie .tx b{font-size:14.5px;line-height:1.3}
  .optie .tx small{display:none}
  .optie .ico{font-size:20px;width:26px}
  .opties.twee{grid-template-columns:1fr 1fr;gap:6px}
  .opties.twee .optie{flex-direction:column;text-align:center;padding:8px 6px;gap:2px;justify-content:center}
  .opties.twee .optie .vink{position:absolute;top:5px;right:5px;width:18px;height:18px;font-size:11px;border-radius:5px}
  .opties.twee .optie .tx b{font-size:13.5px}
  .schaal button{padding:9px 4px;font-size:13px}
  .stelling{min-height:0;padding:18px}
  .hero .grootA{width:120px;opacity:.4}
}
@media print{header.top .top-r,.voortgang,.deelbalk,#navbar{display:none}body{overflow:visible}.app{height:auto}.eind{background:#fff;color:#000;border:2px solid #000}.eind h2{color:#000}}

/* ===================== Module SLB periode 6 ===================== */
.scherm.stil{animation:none}
.top-r a.toplink,.top-r a.toplink:visited{color:var(--zacht);font-size:12.5px;text-decoration:underline}
.top-r a.toplink:hover{color:var(--tekst)}
a.terug{text-decoration:none}
.fase{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;padding:2px 9px;border-radius:99px;background:var(--accent-l);color:var(--tekst);margin-left:6px;vertical-align:1px}
.fase.k{background:var(--tekst);color:#fff}
.hero .fase,.tussen .fase{background:#fff}.hero .fase.k,.tussen .fase.k{background:var(--tekst)}
.deelbalk .lesnaam{background:var(--tekst);color:#fff;font-weight:600}
.hero.klein{padding:18px 22px 14px}
.voortgangtekst{font-size:14px;margin:4px 0 0!important}
.lesgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.lesgrid{grid-template-columns:1fr 1fr}}
.les-tegel{position:relative;display:flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--tekst);background:var(--kl);border-radius:18px;padding:12px 14px;min-height:122px;border:2px solid transparent;transition:transform .12s,border-color .15s}
.les-tegel:hover{transform:translateY(-2px);border-color:var(--k)}
.les-tegel .lnr{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--kd)}
.les-tegel .lico{font-size:24px;line-height:1.2}
.les-tegel b{font-size:15px;line-height:1.25}
.les-tegel small{font-size:12.5px;color:var(--zacht);line-height:1.3}
.les-tegel .st{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#fff}
.les-tegel .st.klaar{background:var(--tekst);color:#fff}
.les-tegel.volgende{border-color:var(--tekst);box-shadow:0 6px 18px rgba(30,36,38,.12)}
.doel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.doel{grid-template-columns:1fr}}
.doel .kaart{padding:12px 16px;border-radius:16px}
.doel ul{margin:2px 0 0;padding-left:18px;font-size:14.5px}
ul.prog{list-style:none;padding:0}
.prog li{display:flex;gap:10px;font-size:14px;margin-bottom:2px;line-height:1.35}
.prog li b{min-width:52px;color:var(--accent-d);flex:none}
.situatie{background:var(--vlak);border-left:5px solid var(--accent);border-radius:0 14px 14px 0;padding:10px 14px;margin:2px 0 10px;font-size:15.5px;line-height:1.45}
.fb{border-radius:14px;padding:10px 14px;margin-top:10px;font-size:14.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;animation:in .3s ease}
.fb:empty{display:none}
.fb .fi{font-size:22px;line-height:1.1}
.fb.goed{background:#DDF7E9}.fb.kan{background:#FFF3CC}.fb.fout{background:#FDE3D6}
.optie.goed{border-color:var(--m-groen);background:#EAFBF2}
.optie.kan{border-color:var(--basis);background:#FFF6DC}
.optie.fout{border-color:var(--m-zalm);background:#FFF0E8}
.optie.beste{border-style:dashed;border-color:var(--m-groen)}
.optie:disabled{cursor:default;color:var(--tekst)}
.optie .oi{margin-left:auto;font-size:18px;flex:none}
.optie .bedrag{margin-left:auto;font-weight:700;white-space:nowrap;padding-left:10px}
.schaal.drie{grid-template-columns:repeat(3,1fr)}
@media (max-width:480px){.schaal.drie{grid-template-columns:repeat(3,1fr)}}
.punten{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.punt{background:var(--accent-l);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4}
.punt .pi{font-size:22px;display:block}
.punt b{display:block;font-size:14.5px}
.rkaart{background:var(--accent-l);border-radius:20px;padding:20px 22px;font-size:clamp(17px,2.6vw,21px);font-weight:500;line-height:1.35;min-height:92px;display:flex;align-items:center;margin:8px 0 10px}
.bakken{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}
.bakken button{border:2px solid var(--lijn);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;font-weight:600;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.bakken button i{font-style:normal;font-size:24px}
.bakken button:hover:not(:disabled){border-color:var(--accent)}
.bakken button.goed{border-color:var(--m-groen);background:#EAFBF2}
.bakken button.fout{border-color:var(--m-zalm);background:#FFF0E8}
.bakken button:disabled{cursor:default;color:var(--tekst)}
.bakken button:disabled:not(.goed):not(.fout){opacity:.5}
.stippen{display:flex;gap:5px;align-items:center;margin:2px 0 0}
.stippen i{width:10px;height:10px;border-radius:50%;background:var(--lijn)}
.stippen i.g{background:var(--m-groen)}.stippen i.f{background:var(--m-zalm)}.stippen i.nu{background:var(--tekst)}
.stippen .klein{margin-left:6px}
.score{font-size:58px;font-weight:700;line-height:1;color:var(--accent-d)}
.volg{display:grid;gap:6px;margin-top:8px}
.vrij{display:flex;align-items:center;gap:10px;border:2px solid var(--lijn);border-radius:14px;padding:6px 8px 6px 10px;background:#fff;font-size:14.5px;line-height:1.3}
.vrij .vn{width:26px;height:26px;border-radius:50%;background:var(--accent-l);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.vrij .vt{flex:1}
.vrij button{border:1.5px solid var(--lijn);background:var(--vlak);border-radius:9px;width:34px;height:30px;cursor:pointer;font-size:15px;flex:none}
.vrij button:hover:not(:disabled){border-color:var(--accent)}
.vrij button:disabled{opacity:.3;cursor:default}
.vrij.goed{border-color:var(--m-groen);background:#EAFBF2}.vrij.fout{border-color:var(--m-zalm);background:#FFF0E8}
.linkknop{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;font-size:14px}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.starters button{border:1.5px dashed var(--accent-d);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.starters button:hover{background:var(--accent-l)}
.saldo{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.saldo span{background:var(--vlak);border-radius:12px;padding:6px 12px;font-size:12.5px;line-height:1.25}
.saldo span b{display:block;font-size:17px}
.saldo .over{background:#DDF7E9}.saldo .over.min{background:#FDE3D6}
.tabel{width:100%;border-collapse:collapse;font-size:14px}
.tabel td{padding:4px 6px;border-bottom:1px solid var(--lijn)}
.tabel td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.tabel tr.tot td{border-bottom:0;font-weight:700;font-size:15.5px;padding-top:8px}
.mijn{margin:4px 0 6px;line-height:2}
.chip.v{background:var(--vlak);margin:0 4px 0 0}
.vragen{display:grid;gap:8px;margin-top:8px;counter-reset:v}
.vraag{display:flex;gap:12px;align-items:center;background:var(--accent-l);border-radius:16px;padding:11px 16px;font-size:clamp(15.5px,2.2vw,18px);font-weight:500;line-height:1.35}
.vraag::before{counter-increment:v;content:counter(v);width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tabs button{border:2px solid var(--lijn);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.tabs button:hover{border-color:var(--accent)}
.tabs button.aan{background:var(--tekst);color:#fff;border-color:var(--tekst)}
.rol{border-radius:18px;padding:14px 18px;background:var(--accent-l);font-size:15.5px;animation:in .3s ease}
.rol .rl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d)}
.verborgen{border:2px dashed var(--lijn);border-radius:18px;padding:18px;text-align:center;color:var(--zacht);font-size:14.5px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:6px}
@media (max-width:560px){.formgrid{grid-template-columns:1fr}}
.formgrid label{font-size:13px;font-weight:500}
.formgrid input{padding:8px 11px;margin-top:2px}
.spiek{border:2.5px solid var(--tekst);border-radius:18px;padding:12px 18px;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;font-size:14px}
.spiek h3{grid-column:1/-1;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center}
.spiek .mini-logo{height:18px;color:var(--basis)}.spiek .mini-logo svg{height:100%;width:auto;display:block}
.spiek .r{display:flex;flex-direction:column;border-bottom:1px dashed var(--lijn);padding:3px 0;line-height:1.35}
.spiek .r small{font-size:11px;color:var(--zacht)}
.spiek .breed{grid-column:1/-1}
.spiek .leeg{color:var(--lijn)}
@media (max-width:560px){.spiek{grid-template-columns:1fr}}
.tb{display:grid;gap:5px;margin-top:6px}
.tb > div{display:flex;gap:10px;align-items:flex-start;background:var(--vlak);border-radius:12px;padding:6px 12px;font-size:14px;line-height:1.35}
.tb > div > span{font-size:20px}
.tb b{display:block;font-size:12.5px;color:var(--zacht);font-weight:600}
.docent details{border:1.5px solid var(--lijn);border-radius:16px;padding:10px 16px;margin-bottom:8px;background:#fff}
.docent summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.docent summary::-webkit-details-marker{display:none}
.docent summary .dot{width:12px;height:12px;border-radius:50%;flex:none}
.docent details[open] summary{margin-bottom:6px}
.docent h4{margin:10px 0 2px;font-size:14px}
.docent ul,.docent ol{margin:2px 0 6px;padding-left:20px;font-size:14.5px}
.docent li{margin-bottom:2px}
.docent p{font-size:14.5px}
.cert{text-align:center;padding:26px 22px!important}
.cert .lvl{font-size:clamp(40px,8vw,64px);font-weight:700;line-height:1;color:var(--basis);letter-spacing:-.02em;margin-top:6px}
.cert .grootA{opacity:.18}
@media (max-height:720px){
  .les-tegel{min-height:0;padding:10px 12px}
  .les-tegel .lico{font-size:20px}
  .hero.klein{padding:14px 20px 10px}
  .hero.klein h1{font-size:clamp(24px,4vw,32px)}
}
@media (max-height:640px){
  .situatie{padding:8px 12px;margin-bottom:6px;font-size:14.5px}
  .rkaart{min-height:70px;padding:14px 18px;margin:6px 0 8px}
  .fb{padding:8px 12px;margin-top:6px;font-size:14px}
  .vraag{padding:8px 14px}
  .vrij{padding:4px 8px}
  .doel ul,.prog li{font-size:13.5px}
}
@media print{
  body *{visibility:hidden}
  .print,.print *{visibility:visible}
  .print{position:absolute;left:0;top:0;width:100%}
  .docent,.docent *{visibility:visible}
  .docent{position:absolute;left:0;top:0;width:100%}
  .docent details{break-inside:avoid}
}

.hero{background:var(--accent-l)}.hero .grootA{color:var(--accent)}

/* ================== MOTOR ================== */
const OPSLAG = 'slb_p6_v1', DOOR = 'slb_doorstroom_v1';
const $ = s => document.querySelector(s);
const el = $('#scherm'), navbar = $('#navbar');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(n){ return (n < 0 ? '− ' : '') + '€ ' + Math.abs(Math.round(n)).toLocaleString('nl-NL'); }

let S = laad();
function laad(){ try{ const x = JSON.parse(localStorage.getItem(OPSLAG)); if(x && x.les) return x; }catch(e){} return {les:{}, uitdaging:'', spiek:{}}; }
function bewaar(){ try{ localStorage.setItem(OPSLAG, JSON.stringify(S)); }catch(e){} }
function door(){ try{ return JSON.parse(localStorage.getItem(DOOR)); }catch(e){ return null; } }
function naam(){ const d = door(); return (d && d.naam || '').trim(); }
function LS(nr){ return S.les[nr] || (S.les[nr] = {stap:0, a:{}, klaar:false}); }

const FASEN = ['Intro', 'Aan de slag', 'Nabespreking'];
const PILL = ['', '🧑‍🏫 Klassikaal', '🧑‍💻 Zelfstandig', '🧑‍🏫 Klassikaal'];
function pill(f){ return `<span class="fase ${f !== 2 ? 'k' : ''}">${PILL[f]}</span>`; }
function zetKleur(k){ const r = document.documentElement.style; r.setProperty('--accent', k[0]); r.setProperty('--accent-l', k[1]); r.setProperty('--accent-d', k[2]); }

function schermen(les){
  if(les._s) return les._s;
  const l = [...les.schermen,
    {type:'tussen', fase:3, titel:'Nabespreking', tekst:'Klaar met de opdrachten? Mooi! Wacht nu op je docent. Jullie bespreken samen wat je hebt gekozen.'},
    {type:'nabespreking', vragen:les.nabespreking},
    {type:'feedback'},
    {type:'klaar'}];
  let fase = 1;
  l.forEach((s, i) => { if(s.type === 'tussen') fase = s.fase; s.fase = fase; if(!s.id) s.id = s.type + i; });
  return les._s = l;
}
function status(les){
  if(les.extern){ const d = door(); if(!d) return 'nieuw'; if(d.keuze) return 'klaar'; return Object.keys(d.a || {}).length ? 'bezig' : 'nieuw'; }
  const L = S.les[les.nr]; if(!L) return 'nieuw'; if(L.klaar) return 'klaar'; return (L.stap > 0 || Object.keys(L.a).length) ? 'bezig' : 'nieuw';
}
function lesLink(l){ return l.extern || '#les' + l.nr; }

/* ---------- Router ---------- */
let CUR = null, LAATST = '';
function render(){
  const h = location.hash.replace('#', '');
  const m = h.match(/^les(\d)$/);
  if(m){ const les = LESSEN.find(l => l.nr === +m[1] && !l.extern); if(les) return renderLes(les); }
  if(h === 'docent') return renderDocent();
  renderOverzicht();
}
window.addEventListener('hashchange', render);

function mount(key){
  el.innerHTML = ''; navbar.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'scherm' + (key === LAATST ? ' stil' : '');
  LAATST = key; el.appendChild(div); el.scrollTop = 0;
  return div;
}
function kader(metVoortgang){
  $('#vgWrap').hidden = !metVoortgang; $('#deelbalk').hidden = !metVoortgang;
  $('#wie').textContent = naam();
}

      <span class="lnr">Les ${l.nr}</span><span class="lico">${l.ico}</span><b>${esc(l.titel)}</b><small>${esc(l.sub)}</small>

  navbar.innerHTML = `<a class="terug" href="#docent">🧑‍🏫 Voor de docent</a><div class="rechts">${volgende ? `<a class="knop" href="${lesLink(volgende)}">${st[LESSEN.indexOf(volgende)] === 'bezig' ? 'Verder met' : 'Start'} les ${volgende.nr} →</a>` : '<span class="klein">Alles afgerond! 🎉</span>'}</div>`;

/* ---------- Les ---------- */
function renderLes(les){
  const L = LS(les.nr), lijst = schermen(les);
  if(L.stap >= lijst.length) L.stap = lijst.length - 1;
  L.verst = Math.max(L.verst || 0, L.stap); // voor "Verder waar ik was"
  const s = lijst[L.stap]; CUR = {les, L, s};
  zetKleur(les.kleur); kader(true);
  $('#toplinks').innerHTML = `<a class="toplink" href="#">← Alle lessen</a><button type="button" id="resetLes">↺ Les opnieuw</button>`;
  $('#resetLes').onclick = () => { if(confirm('Deze les opnieuw beginnen? Je antwoorden van deze les worden gewist.')){ delete S.les[les.nr]; bewaar(); LAATST = ''; render(); } };
  $('#vg').style.width = Math.round(100 * L.stap / (lijst.length - 1)) + '%';
  $('#deelbalk').innerHTML = `<span class="lesnaam">${les.ico} Les ${les.nr}</span>` + FASEN.map((f, i) => `<span class="${i + 1 === s.fase ? 'nu' : i + 1 < s.fase ? 'klaar' : ''}">${i + 1 < s.fase ? '✓ ' : ''}${i + 1}. ${f}</span>`).join('');
  const d = mount('les' + les.nr + '|' + L.stap);
  T[s.type](s, d, les, L);
  bewaar();
}
function volgende(){ CUR.L.stap++; bewaar(); render(); }
function vorige(){ if(CUR.L.stap > 0){ CUR.L.stap--; bewaar(); render(); } }
function nav(kanVerder, tekst = 'Volgende →', extra = ''){
  navbar.innerHTML = `<button class="terug" type="button">← Terug</button><div class="rechts">${extra}<button class="knop" type="button" id="verder" ${kanVerder ? '' : 'disabled'}>${tekst}</button></div>`;
  navbar.querySelector('.terug').onclick = vorige;
  if(CUR && CUR.L.stap === 0) navbar.querySelector('.terug').style.visibility = 'hidden';
  const b = navbar.querySelector('#verder'); b.onclick = volgende; return b;
}
function lab(s, standaard){ return `<span class="label">${s.label || standaard} ${pill(s.fase)}</span>`; }

const OORDEEL = {goed:['👍', 'Sterke keuze'], kan:['🤔', 'Kan, maar…'], fout:['⚠️', 'Niet handig']};
const QUIZ = {goed:['✅', 'Goed!'], fout:['❌', 'Helaas']};

const T = {};

T.intro = (s, d, les, L) => {
  d.innerHTML = `<section class="hero"><div class="grootA">${A_SVG}</div><span class="label">Les ${les.nr} van 8 ${pill(1)}</span>
    <h1>${les.ico} ${esc(les.titel)}</h1><p>${s.tekst}</p></section>
    <div class="doel"><div class="kaart"><h3>🎯 Na deze les…</h3><ul>${les.doelen.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div class="kaart"><h3>⏱️ Programma</h3><ul class="prog">${les.programma.map(([m, t]) => `<li><b>${m} min</b><span>${t}</span></li>`).join('')}</ul></div></div>`;
  const nieuw = !Object.keys(L.a).length && !L.klaar;
  const b = nav(true, nieuw ? 'Start →' : 'Verder →');
  if(!nieuw && L.verst > 1){ b.textContent = 'Verder waar ik was →'; b.onclick = () => { L.stap = L.verst; bewaar(); render(); }; }
};

T.stelling = (s, d, les, L) => {

    <div class="schaal drie">${[['eens', '👍', 'Eens'], ['twijfel', '🤷', 'Twijfel'], ['oneens', '👎', 'Oneens']].map(([v, i, t]) => `<button type="button" data-v="${v}" class="${L.a[s.id] === v ? 'aan' : ''}"><i>${i}</i>${t}</button>`).join('')}</div>
    <p class="hint" style="margin-top:10px">Kies wat jij vindt. Je docent vraagt daarna een paar mensen: <b>waarom?</b></p>`;

};

T.tussen = (s, d) => {

    ${s.na ? `<p class="hint" style="margin-top:10px">${s.na}</p>` : ''}`;
  nav(true);
};

function kiesRender(s, d, L, opts, situatie){
  const lb = s.quiz ? QUIZ : OORDEEL;
  d.innerHTML = `${lab(s, s.quiz ? 'Quizvraag' : 'Wat doe jij?')}${situatie ? `<div class="situatie">${situatie}</div>` : ''}<h2>${esc(s.q)}</h2>
    <div class="opties">${opts.map((o, i) => `<button type="button" class="optie" data-i="${i}"><span class="ico">${o[0]}</span><span class="tx"><b>${esc(o[1])}</b></span><span class="oi"></span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  const b = nav(L.a[s.id] !== undefined);
  const knoppen = [...d.querySelectorAll('.optie')];
  const toon = (i, scroll) => {
    const o = opts[i];
    knoppen.forEach((x, j) => {
      x.className = 'optie'; x.querySelector('.oi').textContent = '';
      if(j === i){ x.classList.add(o[2]); x.querySelector('.oi').textContent = lb[o[2]][0]; }
      else if(opts[j][2] === 'goed') x.classList.add('beste');
      if(s.quiz) x.disabled = true;
    });
    const f = $('#fb'); f.className = 'fb ' + o[2];
    f.innerHTML = `<span class="fi">${lb[o[2]][0]}</span><div><b>${lb[o[2]][1]}</b> ${o[3] || ''} ${s.uitleg || ''}</div>`;
    if(scroll) f.scrollIntoView({block:'nearest', behavior:'smooth'});
  };
  if(L.a[s.id] !== undefined) toon(L.a[s.id]);
  knoppen.forEach(x => x.onclick = () => { const i = +x.dataset.i; L.a[s.id] = i; bewaar(); toon(i, true); b.disabled = false; });
}
T.kies = (s, d, les, L) => kiesRender(s, d, L, s.opts, s.situatie);

T.multi = (s, d, les, L) => {
  const sel = new Set(L.a[s.id] || []);
  const metCheck = s.opts.some(o => o.length > 2);
  d.innerHTML = `${lab(s, 'Kies')}<h2>${esc(s.q)}</h2><p class="hint">Kies er ${s.max}.${metCheck ? ' Klik daarna op <b>Check</b>.' : ''}</p>
    <div class="opties twee">${s.opts.map((o, i) => `<button type="button" class="optie ${sel.has(i) ? 'aan' : ''}" data-i="${i}"><span class="ico">${o[0]}</span><span class="tx"><b>${esc(o[1])}</b></span><span class="vink">✓</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  const gecheckt = () => !!L.a[s.id + '_c'];
  const b = nav(sel.size > 0 && (!metCheck || gecheckt()), 'Volgende →', metCheck ? '<button class="knop rand" type="button" id="check">Check</button>' : '');
  const chk = $('#check');
  const check = (scroll) => {
    L.a[s.id + '_c'] = true; bewaar(); let goed = 0;
    d.querySelectorAll('.optie').forEach((x, i) => {
      const ok = s.opts[i][2]; x.classList.remove('goed', 'fout', 'beste');
      if(sel.has(i)){ x.classList.add(ok ? 'goed' : 'fout'); if(ok) goed++; } else if(ok) x.classList.add('beste');
    });
    const f = $('#fb'), alles = goed === sel.size; f.className = 'fb ' + (alles ? 'goed' : 'kan');
    f.innerHTML = `<span class="fi">${alles ? '👍' : '🤔'}</span><div><b>${goed} van ${sel.size} goed.</b> ${s.uitleg}</div>`;
    if(scroll) f.scrollIntoView({block:'nearest', behavior:'smooth'});
    b.disabled = false; chk.disabled = true;
  };
  d.querySelectorAll('.optie').forEach(x => x.onclick = () => {
    if(metCheck && gecheckt()) return;
    const i = +x.dataset.i;
    if(sel.has(i)) sel.delete(i);
    else { if(sel.size >= s.max){ const e = [...sel][0]; sel.delete(e); d.querySelector(`.optie[data-i="${e}"]`).classList.remove('aan'); } sel.add(i); }

    if(metCheck) chk.disabled = sel.size < s.max; else b.disabled = sel.size === 0;
  });
  if(chk){ chk.disabled = sel.size < s.max; chk.onclick = () => check(true); if(gecheckt()) check(false); }
};

T.ronde = (s, d, les, L) => {

    d.innerHTML = `${lab(s, 'Score')}<section class="tussen"><div class="grootA">${A_SVG}</div><div class="score">${g}/${n}</div>
      <h2 style="margin-top:8px">${g === n ? 'Alles goed! 🏆' : g >= n * .6 ? 'Goed gedaan! 💪' : 'Een paar lastige ertussen. 🤔'}</h2>
      <p>Twijfelde je bij een kaart? Onthoud hem voor de nabespreking.</p></section>`;
    nav(true, 'Volgende →', '<button class="knop rand" type="button" id="opn">↺ Nog een keer</button>');
    $('#opn').onclick = () => { L.a[s.id] = Array(n).fill(null); L.a[s.id + '_i'] = 0; bewaar(); render(); };
    navbar.querySelector('.terug').onclick = () => { L.a[s.id + '_i'] = n - 1; bewaar(); render(); };
    return;
  }
  const it = s.items[ci], gekozen = ant[ci];
  d.innerHTML = `${lab(s, 'Kaarten')}<h2>${esc(s.q)}</h2>
    <div class="stippen">${s.items.map((x, i) => `<i class="${i === ci ? 'nu' : ant[i] == null ? '' : ant[i] === x[1] ? 'g' : 'f'}"></i>`).join('')}<span class="klein">kaart ${ci + 1} van ${n}</span></div>
    <div class="rkaart">${esc(it[0])}</div>
    <div class="bakken">${s.bakken.map(([v, i, t]) => `<button type="button" data-v="${v}"><i>${i}</i>${t}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  const b = nav(gekozen != null, ci < n - 1 ? 'Volgende kaart →' : 'Bekijk je score →');
  b.onclick = () => { L.a[s.id + '_i'] = ci + 1; bewaar(); render(); };
  navbar.querySelector('.terug').style.visibility = 'visible';
  navbar.querySelector('.terug').onclick = () => { if(ci > 0){ L.a[s.id + '_i'] = ci - 1; bewaar(); render(); } else vorige(); };
  const toon = (v, scroll) => {
    const ok = v === it[1];
    d.querySelectorAll('.bakken button').forEach(x => { x.disabled = true; if(x.dataset.v === it[1]) x.classList.add('goed'); else if(x.dataset.v === v) x.classList.add('fout'); });

    const f = $('#fb'); f.className = 'fb ' + (ok ? 'goed' : 'fout');
    f.innerHTML = `<span class="fi">${ok ? '✅' : '❌'}</span><div><b>${ok ? 'Goed!' : 'Het antwoord is: ' + juist[2] + '.'}</b> ${it[2] || ''}</div>`;
    if(scroll) f.scrollIntoView({block:'nearest', behavior:'smooth'});
  };
  if(gekozen != null) toon(gekozen);
  d.querySelectorAll('.bakken button').forEach(x => x.onclick = () => { ant[ci] = x.dataset.v; bewaar(); toon(x.dataset.v, true); b.disabled = false; setTimeout(() => b.focus(), 50); });
};

T.volgorde = (s, d, les, L) => {

    <div class="fb" id="fb"></div>`;

function budget(){
  const a = LS(3).a; const ink = a.baan != null ? BANEN[a.baan][2] : 0;

  POSTEN.forEach(p => { if(a['b_' + p.k] != null) uit += p.opts[a['b_' + p.k]][2]; });
  return {ink, uit, over: ink - uit};
}

  const b = budget();

    <h1 style="color:#fff">Goed gedaan${nm ? ', ' + esc(nm) : ''}! 🎉</h1>
    ${L.a._inzicht ? `<p>Wat je meeneemt: <i>${esc(L.a._inzicht)}</i></p>` : ''}
    <p style="margin:0">${vol ? `Volgende keer: <b>Les ${vol.nr} · ${esc(vol.titel)}</b>.` : 'Je hebt de hele module afgerond. Heel veel succes op je stage!'}</p></section>`;
  navbar.innerHTML = `<button class="terug" type="button">← Terug</button><div class="rechts"><a class="knop" href="#">Naar alle lessen →</a></div>`;
  navbar.querySelector('.terug').onclick = vorige;
};

render();

</script>
</body>
</html>
